<!doctype html><html lang="th"><head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>[hidden]{display:none!important}</style></head><body><title>NightCamp Patch Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Patch notes: one card per game build, newest first; each change a short line under its heading, with a link to the page it touches. */
:root{
  --bg:#eef0f6; --panel:#ffffff; --panel2:#e6e9f2; --line:#cdd2e1; --fg:#18203a; --muted:#56607c;
  --ember:#c4561a; --ember-soft:#f8e3d3; --moon:#3c4fa8; --moon-soft:#e0e5fb; --good:#2f8a55; --bad:#b33a3a;
  --display:'Mitr','Noto Sans Thai',system-ui,sans-serif; --body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10132a; --panel:#181c38; --panel2:#20254a; --line:#2f3563; --fg:#e9ebf7; --muted:#a3a9cc;
  --ember:#f59a4c; --ember-soft:#3a2a26; --moon:#aab8ff; --moon-soft:#262d5c; --good:#6fd39a; --bad:#ff8a8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10132a; --panel:#181c38; --panel2:#20254a; --line:#2f3563; --fg:#e9ebf7; --muted:#a3a9cc;
  --ember:#f59a4c; --ember-soft:#3a2a26; --moon:#aab8ff; --moon-soft:#262d5c; --good:#6fd39a; --bad:#ff8a8a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.65 var(--body);margin:0}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 56px}
h1{font:600 clamp(28px,5vw,40px)/1.1 var(--display);margin:0}
h2{font:500 clamp(21px,3.2vw,26px)/1.25 var(--display);margin:0}
h3{font:600 15px/1.3 var(--display);margin:0;display:flex;align-items:center;gap:8px}
p{margin:0}
.kicker{font:600 11.5px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--ember)}
.muted{color:var(--muted)}
header.top{padding:26px 0 14px}
header.top p{color:var(--muted);margin-top:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:14px}
.chead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 14px}
.build{font:500 13px var(--mono);color:var(--muted)}
.hl{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--ember-soft)}
.sec{margin-top:16px}
.sec ul{margin:6px 0 0;padding-left:20px}
.sec li{margin:5px 0}
.tag{font:600 11px var(--mono);padding:2px 8px;border-radius:999px;background:var(--moon-soft);color:var(--moon);letter-spacing:.5px}
.go{font:500 13px var(--body);color:var(--moon);background:none;border:0;padding:0 0 0 6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.go:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
footer{margin-top:24px;color:var(--muted);font-size:13px}
@keyframes hitfade{0%{box-shadow:0 0 0 3px var(--ember)}100%{box-shadow:0 0 0 3px transparent}}
.hit{animation:hitfade 2.4s ease-out 1;border-radius:8px}
.files{margin-top:4px;font:500 12.5px var(--mono);color:var(--muted)}
details.more{margin:4px 0 2px}
details.more summary{cursor:pointer;font:500 13px var(--body);color:var(--moon);list-style:none;display:inline-flex;align-items:center;gap:4px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:'▾';font-size:11px}
details.more[open] summary::after{content:'▴'}
details.more ul{margin:6px 0 4px;padding:8px 12px 8px 28px;background:var(--panel2);border-radius:10px;font-size:14.5px}
details.more li{margin:3px 0}
.tw{overflow-x:auto;margin-top:6px}
.tw table{border-collapse:collapse;width:100%;font-size:13.5px}
.tw th,.tw td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
.tw th{font:600 11px var(--mono);color:var(--muted);background:var(--panel2)}
.tw .num{text-align:right;font-family:var(--mono)}
</style>

<div class="wrap">
  <header class="top">
    <div class="kicker" id="kick"></div>
    <h1 id="ttl"></h1>
    <p id="sub"></p>
  </header>
  <main id="list"></main>
  <footer id="foot"></footer>
</div>

<script>

const DETAIL_DATA = /*__DETAIL__*/{"d":{"0059|online|0":{"th":["เวอร์ชันก่อนหน้า (21 ต.ค. 23:43) ถอดแถบนี้ออก เวอร์ชันนี้ใส่กลับมาแบบเดิมทุกอย่าง","บนคอม: บรรทัดเครื่อง (FPS สัญญาณ ปิง แชนแนล) อยู่ขอบบนด้านซ้ายของหน้าปัดนาฬิกา ส่วนจำนวนคนออนไลน์อยู่ใต้ชื่อแมพหนึ่งแถว","มือถือ/แท็บเล็ต: แถบอยู่เหนือการ์ดตัวละคร ภายในขอบจอที่ปลอดภัย","จำนวนคนนับจากเซิร์ฟเวอร์ทุกแมพทุกแชนแนล อัปเดตทุก 10 วิ ตัวเลขที่เก่ากว่า 25 วิจะไม่แสดง","ไม่มีผลกับการเล่น เป็นข้อมูลบนจออย่างเดียว"],"en":["The previous build (21 Oct 23:43) removed this strip; this one puts it back exactly as before.","PC: the machine line (FPS, signal, ping, channel) sits on the top edge left of the clock dial; the player counts one row under the map name.","Phones/tablets: the strip sits above the hero card, inside the safe area.","Counts come from the server across every map and channel, every 10 s; numbers older than 25 s are hidden.","Display only, no gameplay effect."]},"0059|fix|0":{"th":["คำลอยเหนือหุ่นฝึก (เช่น คำร้องตอนติดสถานะ) เดิมลอยที่ความสูง 210 ซึ่งทับช่วงที่หุ่นโชว์ชื่อ DPS และยอดรวม","ตอนนี้: เหนือหุ่นฝึกลอยที่ 300 ขนาดตัวอักษร 28 (เดิม 38) · มอนปกติยังเหมือนเดิม (210 ขนาด 38)","ทั้งออฟไลน์และออนไลน์"],"en":["Words over a training dummy (e.g. status shouts) used to float at height 210, right over its name, DPS and totals.","Now: over a dummy they float at 300, font size 28 (was 38); normal monsters unchanged (210, size 38).","Offline and online."]},"2343|balance|0":{"th":["เดิม: ต้องรอเหยี่ยวเกาะแขนก่อนถึงกดได้ ขึ้น \"เหยี่ยวยังโฉบอยู่\" ความเร็วโจมตีจึงแทบไม่ช่วย","ตอนนี้: กดได้ทุกครั้งที่มีเหยี่ยวและมีเป้าในระยะ 760 ถ้าเหยี่ยวบินอยู่ จะเพิ่มจำนวนโฉบให้ตัวที่บินอยู่แล้วเปลี่ยนเป้าทันที ไม่ต้องบินกลับ","สะสมโฉบได้สูงสุด 10 ครั้งต่อเหยี่ยว (Lv 10 กดหนึ่งครั้งได้ 5 โฉบ = 2 ครั้งเต็ม)","โฉบเอง (เหยี่ยวโฉบอัตโนมัติ: โอกาส LUK/6 + Lv/2 %, ครั้งละ 2 โฉบ ไม่ใช้ SP) ก็ไม่ต้องรอเหยี่ยวกลับแล้ว","ไม่เปลี่ยน: ดาเมจต่อโฉบ คูลดาวน์ 4 วิ SP 8 + 2×Lv","ฝั่งออนไลน์เซิร์ฟเวอร์เป็นคนบินเหยี่ยว ยังไม่แน่ใจว่าเซิร์ฟเวอร์ให้โฉบต่อกันแบบนี้ด้วยหรือไม่"],"en":["Before: the falcon had to be back on the arm (\"still diving\"), so attack speed barely helped.","Now: it fires whenever you have a falcon and a target within 760; a falcon in flight gets the extra dives and retargets at once, no flight home.","Up to 10 queued dives per falcon (Blitz Lv 10 gives 5 per cast = two casts).","The automatic dive (LUK/6 + Lv/2 % chance, 2 dives, no SP) no longer waits for the falcon either.","Unchanged: damage per dive, 4 s cooldown, SP 8 + 2×Lv.","Online the server flies the falcons; it is not certain the server chains dives the same way."]},"2343|balance|1":{"th":["ปกติวัตถุดิบโดนลดตามช่องว่างเลเวลกับมอน: ห่าง ≤3 ได้เต็ม · 4–8 = 70% · 9–14 = 40% · 15–20 = 20% · มากกว่า = 5%","ตอนนี้: ถ้าเควสเนื้อเรื่องที่ทำอยู่ยังขาดวัตถุดิบชิ้นนั้น จำนวนชิ้นที่ได้จะไม่โดนลด (เต็ม 100%)","ยกเว้นเฉพาะ \"จำนวนชิ้น\" ของวัตถุดิบที่เควสต้องการ โอกาสดรอปและของชิ้นอื่นยังคิดช่องว่างเลเวลตามปกติ","ตัวอย่างที่ทีมงานเจอ: เควสเก่า \"รวงผึ้งน้ำผึ้ง 5/20\" แทบไม่ดรอปให้ตัวละครเลเวลสูง"],"en":["Materials are normally cut by the level gap: ≤3 full · 4–8 70% · 9–14 40% · 15–20 20% · beyond 5%.","Now: if your current story quest still needs that material, its piece count is not cut (100%).","Only the piece count of the quest's material is exempt; drop chance and other drops still use the gap.","The case behind it: an old quest's \"honeycomb 5/20\" barely dropped for a high-level hero."]},"2343|balance|2":{"th":["เดิม: ระหว่างบาร์ร่ายหรือสกิลที่ต้องยืนร่ายต่อเนื่อง (เช่น หมุนตัวของเบอร์เซิร์กเกอร์) ปุ่มยาถูกล็อก","ตอนนี้: ปุ่ม 1 (ยาแดง) และ 2 (ยาฟ้า) ทำงานก่อนการเช็คสกิลที่กำลังร่าย จึงดื่มได้ทุกเมื่อ","ขนาดยาไม่เปลี่ยน"],"en":["Before: during a cast bar or a channelled skill (e.g. the berserker's spin) the potion keys were locked.","Now: keys 1 (red) and 2 (blue) are read before the channel check, so they always work.","Potion amounts unchanged."]},"2343|items|0":{"th":["ชื่อเปลี่ยนอย่างเดียว ค่า Lv ATK เกรด ธาตุ และแหล่งดรอปเท่าเดิมทุกชิ้น","ชนิดอาวุธ \"ฮูมะ\" → \"ดาวยักษ์\" · อาวุธเริ่มต้น \"ฮูมะชูริเคน\" → \"ดาวกระจายยักษ์\"","อาวุธในคลัง 40 ชิ้น และอาวุธดรอปตามเขต 5 ชิ้น เปลี่ยนคำนำหน้าจาก ฮูมะ เป็น ดาวยักษ์ (รายชื่อเต็มด้านล่าง)","คำอธิบายสกิลนินจา (พัดดาวกระจาย ดาวชิ่ง ดาวคู่ ขว้างดาวยักษ์วกกลับ) เปลี่ยนคำตาม","ในเกมคำอธิบาย \"ขว้างดาวยักษ์วกกลับ\" มีคำว่า \"ยักษ์\" ซ้ำสองครั้ง เป็นคำพิมพ์ซ้ำในเกม","ในวิกิ ค้นชื่อเก่า \"ฮูมะ\" ก็ยังเจอ"],"en":["Names only: Lv, ATK, grade, element and drop sources are the same for every piece.","Weapon type \"ฮูมะ\" → \"ดาวยักษ์\" (Giant Star) · starter \"ฮูมะชูริเคน\" → \"ดาวกระจายยักษ์\".","40 catalogue weapons and 5 area-drop weapons swap the prefix (full list below).","The ninja skill texts (Star Fan, Ricochet, Twin Star, Giant Star Boomerang) use the new word.","In game the Boomerang text now reads \"ยักษ์\" twice, a typo in the game.","The old name still finds them in this wiki."]},"2343|items|1":{"th":["ชื่อบอส: \"ฮาร์ล็อก ผู้เก็บเกี่ยวยามดึก\" → \"ฮาร์เวน ผู้เก็บเกี่ยวยามดึก\"","ของที่ดรอปเปลี่ยนชื่อตาม: \"เคียวรากดำของฮาร์เวน\" (0.5%) และแก่นราก \"แก่นรากของฮาร์เวน\" · เสื้อคลุมและหมวก (1% ต่อชิ้น) เปลี่ยนคำอธิบายเป็น \"จากฮาร์เวน\"","ไม่เปลี่ยน: Lv 20 เกิดที่ไร่ฟักทองและเขตรอบ ๆ (เขาวงกตข้าวโพด คอกสัตว์ ลานนวดข้าว) ท่า ทุบพื้น โฉบ วาร์ป เรียกอีกา 3 ตัว","ค่าของไม่เปลี่ยน: เสื้อคลุม DEF 8 MDEF 4 AGI 3 คริ 3% · หมวก DEF 3 AGI 2 · เคียว AGI 2 คริ 4% · ทุกชิ้นมหากาพย์ ต้อง Lv 20"],"en":["Boss: \"Harlock the Night Reaper\" → \"Harven the Night Reaper\".","Drops follow: the scythe (0.5%) and the root core are now \"of Harven\"; robe and hat (1% each) now say \"from Harven\".","Unchanged: Lv 20, the pumpkin farm and its fields (corn maze, pens, threshing yard), moves slam, swoop, blink, 3 crows.","Item stats unchanged: robe DEF 8 MDEF 4 AGI 3 crit 3% · hat DEF 3 AGI 2 · scythe AGI 2 crit 4% · all epic, Lv 20."]},"2343|bot|0":{"th":["ระยะล่ามอน: เดิม ห่างขอบวงปาร์ตี้ไม่เกิน 140 หรือห่างเพื่อนไม่เกิน 380 → ตอนนี้ 60 และ 300","ระยะเก็บของ: ต้องอยู่ห่างขอบวงไม่เกิน 210 หรือห่างเพื่อนไม่เกิน 300 หรือห่างตัวเราไม่เกิน 220","เหตุผล: ออกนอกวงแล้วหลุดบัฟปาร์ตี้และโบนัสเส้นด้าย","วงที่แสดงบนพื้นตอนเปิดออโต้ในปาร์ตี้ใช้ขนาดใหม่นี้"],"en":["Hunting range: within 140 of the party ring or 380 of a member → now 60 and 300.","Looting range: within 210 of the ring, 300 of a member, or 220 of you.","Why: leaving the ring dropped party buffs and the thread bonus.","The ring drawn on the ground in a party uses the new size."]},"2343|bot|1":{"th":["เก็บของทีละชิ้นจนเก็บได้หรือยอมแพ้ ไม่สลับไปมาระหว่างหลายชิ้น","ยืนห่างของไม่เกิน 100 นานเกิน 4 วิแล้วยังเก็บไม่ได้ → ข้ามชิ้นนั้น 30 วิ (ข้ามซ้ำได้นานขึ้นทีละเท่าตัวสูงสุด 2 นาที) และเลี่ยงจุดนั้น 40 วิ","โหมดตีก่อนแล้วเก็บ: มอนที่ตีเพื่อนในตี้ (เพื่อนห่างไม่เกิน 600) ก็นับเป็นไฟต์ จะไม่ทิ้งไฟต์ไปเก็บของที่อยู่ไกลเกิน 150","ของที่ตกอยู่นานเกิน 90 วิ ยังเก็บเลยตามกฎเดิม"],"en":["Locks onto one drop until it is picked up or given up, no switching between drops.","Within 100 of a drop for over 4 s without picking it up → skips it for 30 s (doubling on repeats, up to 2 min) and avoids the spot 40 s.","\"Fight first\": a monster attacking a teammate within 600 counts as a fight; it won't leave for drops farther than 150.","Drops older than 90 s are still taken, as before."]},"2343|online|0":{"th":["แท็บชื่อ \"ปฏิทิน\" ในหน้าเควส (J) แสดงของรางวัลเดือนนี้จากเซิร์ฟเวอร์ (เริ่มใหม่ทุกวันที่ 1 เข้าเกมวันไหนได้กล่องวันนั้น ไม่ต้องติดต่อกัน)","เข้าเกมแล้วราว 2.5 วิ รับของวันนี้ให้เอง และเช็คทุก 60 วิ เผื่อข้ามเที่ยงคืน","มีข้อความแจ้ง เช่น ของขวัญ 7 วันแรก ของต้อนรับกลับ และปฏิทินค่ายวันที่ n","ของในกล่องเซิร์ฟเวอร์เป็นคนกำหนด วิกิยังไม่เห็นรายการ","กล่องรายสัปดาห์เท่าเดิม: เหรียญ Lv×500 · หินออฟ 2 · ขนนกไออุ่น 2 · เหรียญซีซัน 50"],"en":["The quest page (J) has a \"ปฏิทิน\" tab with this month's server rewards (resets on the 1st; any day you log in counts, no streak needed).","About 2.5 s after entering the world today's reward is claimed for you; it rechecks every 60 s around midnight.","Chat lines tell you about the first-7-days gift, the welcome-back gift and the camp calendar day.","The box contents are set by the server, not visible to the wiki yet.","The weekly chest is unchanged: Lv×500 coins, 2 option stones, 2 warm feathers, 50 season tokens."]},"2343|online|1":{"th":["ขอเก็บก่อนแล้วค่อยเก็บจริง ถ้าโดนปฏิเสธจะลองใหม่ทุก 0.3 วิ ปฏิเสธเกิน 6 ครั้งจะพักชิ้นนั้น 5 วิ","ข้อความ \"ได้รับ ...\" บอกชื่อของ และเงินขึ้นเป็น \"ได้รับ N เหรียญ\"","กระเป๋าอุปกรณ์เต็มจะไม่พยายามเก็บอุปกรณ์","กระเป๋าที่เปิดอยู่อัปเดตทันทีเมื่อได้วัตถุดิบหรือยา และของกองใหญ่ 60–120 ชิ้นไม่ทำให้เฟรมตกหนักแล้ว (เดิม 60 ชิ้นเหลือ 24 FPS)"],"en":["Claims a drop before picking it up; refused asks retry every 0.3 s, and after 6 refusals the drop rests 5 s.","\"ได้รับ ...\" lines name the item, and gold reads \"ได้รับ N coins\".","With a full gear bag it no longer tries to pick up gear.","An open bag refreshes at once on new materials or potions, and piles of 60–120 drops no longer tank the frame rate (60 drops used to give 24 FPS)."]},"2343|online|2":{"th":["ป้ายใหม่บอกสถานะ: ออนไลน์ / กำลังเปลี่ยนแมพ / กำลังต่อใหม่ / หลุดการเชื่อมต่อ / ออฟไลน์ พร้อมแมพ แชนแนล คนรอบตัว และปิง","แถบ FPS และจำนวนคนทั้งเซิร์ฟ/รายแมพถูกถอดในเวอร์ชันนี้ แล้วกลับมาในเวอร์ชัน 22 ต.ค. 00:59"],"en":["A new badge shows online / changing map / reconnecting / disconnected / offline, plus map, channel, players nearby and ping.","The FPS strip and the server/per-map counts left in this build and came back in the 22 Oct 00:59 build."]},"2343|fix|0":{"th":["เดิม: เริ่มตัดไม้/ขุดแร่/ตกปลาตอนบาร์ร่ายยังเต็มไม่สุด แล้วสกิลค้างใช้ไม่ได้","ตอนนี้: ถ้ากำลังร่าย จะเริ่มเก็บไม่ได้ ขึ้น \"รอร่ายสกิลจบก่อน\" · การร่ายที่ค้างโดยไม่มีบาร์จะถูกยกเลิกเอง","กดสกิลระหว่างเก็บ: ออฟไลน์หยุดการเก็บก่อนแล้วร่าย · ออนไลน์กดสกิลไม่ได้ระหว่างเก็บ (ตรงกับเซิร์ฟเวอร์)"],"en":["Before: starting to chop, mine or fish while a cast bar was filling left skills locked.","Now: you can't start gathering while casting (\"wait for the cast to finish\"); a stuck cast without a bar is cancelled.","Pressing a skill while gathering: offline it stops the gathering then casts; online skills are ignored while gathering (as on the server)."]},"2343|fix|1":{"th":["วงจังหวะอยู่ที่ขอบลำต้นฝั่งเรา ห่างจากกลางต้น 16–44 ตามความกว้าง สูงระดับมือ (ไม่ใช่โคนต้น)","ขนาดวงคูณ 0.75–1.1 ตามความกว้างของต้นไม้","กติกาเดิม: ฟันตรงรอยได้แรง 2 เท่า"],"en":["The ring sits on the trunk edge on your side, 16–44 from its centre by width, at hand height (not the base).","Ring size ×0.75–1.1 by the tree's width.","Same rule: a strike on the mark counts double."]},"2343|fix|2":{"th":["ถอด: หน้าต่างอุปกรณ์แบบเก่า หน้าต่างอาชีพเสริมเก่า ปาร์ตี้เก่า ร้าน/กระเป๋าวัสดุเก่า สเตตัสเก่า แผนที่ใหญ่เก่า และห้องดูท่าทาง (ปุ่ม L)","ฟีเจอร์ย้ายไปหน้าต่างใหม่: ป้าย \"ถือไม่ได้\" และ \"ต้อง Lv\" สีแดงในกระเป๋า · ช่องเครื่องประดับ · บรรทัดโบนัสเซ็ต \"ครบ 2/3 ชิ้น\" · ป้ายสองธาตุของอาร์คเมจย้ายไปหน้าต่างสกิล","รีเซ็ตสกิลเท่าเดิม: ฟรีถึง Base Lv 40 จากนั้น (Lv − 39) × 100 เหรียญ และมีรีเซ็ตฟรีของขวัญ 1 ครั้งต่อตัวละคร","ปุ่มลัด: I กระเป๋า · H สมุดอาชีพเสริม · K สกิล · J เควส · ไม่มี L แล้ว"],"en":["Removed: the old equipment, life-skill, party, shop/material pouch, status and big-map windows, and the pose room (L).","Features moved to the new windows: \"can't wield\" and red \"Lv n\" marks in the bag, accessory slots, \"2/3 pieces\" set lines, and the archmage two-element tag in the skill window.","Skill reset unchanged: free up to Base Lv 40, then (Lv − 39) × 100 coins, plus one free gift reset per character.","Keys: I bag · H life book · K skills · J quests · no more L."]},"2343|fix|3":{"th":["ข้อความในแชทเรียงตามเวลาจริงของเซิร์ฟเวอร์ ข้อความเตือนจึงไม่ค้างล่างสุดจนรีโหลด","ปาร์ตี้หายไปไม่ถึง 2 วิ (เปลี่ยนแมพ/ต่อใหม่) จะไม่ขึ้น \"ออกจากปาร์ตี้\" และไม่เด้งการ์ด \"เข้าปาร์ตี้\" ซ้ำ","ตัวละครใหม่เข้าหน้าสร้างตัวละครเสมอ ช่องตั้งชื่อแบบเก่าถูกถอด"],"en":["Chat lines sort by the server clock, so notices no longer stick at the bottom until a reload.","A party gone for under 2 s (map change, reconnect) no longer shows \"left the party\" or a second \"joined\" card.","New heroes always get the character creator; the old name box is gone."]},"1537|new|0":{"th":["ออนไลน์: ขอเซิร์ฟเวอร์พาออก ได้เฉพาะตอนติดซอกหรือติดในช่องเล็กจริง ไม่งั้นขึ้น \"ไม่ได้ติดอยู่\" · ใช้ได้ทุก 10 วิ","ออฟไลน์: ใช้การเช็คแบบเดียวกันแล้วกระโดดออกให้","คำสั่งแชท: /ติด /stuck /unstuck"],"en":["Online it asks the server to move you only when you are really wedged or shut in a small pocket (else \"not stuck\"); once per 10 s.","Offline it runs the same test and hops you out.","Chat commands: /ติด, /stuck, /unstuck."]},"1537|new|1":{"th":["จบรอบทันที กลับไปที่ประตูรากในค่าย ชั้นที่ผ่านแล้วยังได้รางวัลตามปกติ","ใช้ได้แม้ตัวล้มอยู่ · ในปาร์ตี้เพื่อนเล่นต่อได้","เพิ่มหลังผู้เล่นติดกำแพงที่ชั้น 30 · คำสั่ง /ออกราก หรือ /leaveroot"],"en":["Ends the run at once and returns you to the root gate in camp; cleared floors still pay.","Works even while down; in a party, friends keep playing.","Added after a player got stuck in a wall on floor 30 · /ออกราก or /leaveroot."]},"1537|new|2":{"th":["นับ: มอนที่ฆ่า (หีบไม่นับ) EXP Job EXP วัตถุดิบ อุปกรณ์ที่ดรอปพร้อมมอนที่ดรอป เลเวลที่ขึ้น และ EXP ที่เสียตอนล้ม","เงิน ยา และจำนวนครั้งที่ล้มนับอยู่แล้ว","สรุปทำเมื่อเปิดบอทต่อเนื่อง 5 นาทีขึ้นไป"],"en":["Counts kills (chests aren't kills), EXP, Job EXP, materials, gear drops with their monster, levels gained and EXP lost on falls.","Coins, potions and falls were already counted.","A summary is made after a run of 5+ minutes."]},"1537|bot|0":{"th":["เดิม: เรียกหมาป่าใหม่ทุกครั้งที่คูลดาวน์ 10 วิหมด แม้ตัวเดิมยังอยู่","ตอนนี้: เรียกใหม่เมื่อ HP ของสัตว์ต่ำกว่า 35% เหลือเวลาไม่ถึง 2 วิ หรือหายไปแล้ว","ใช้กับหมาป่า วายเวิร์น โคมไฟ และหุ่นเชิด ทั้งออฟไลน์และออนไลน์"],"en":["Before: it re-summoned the wolf every time the 10 s cooldown ended, even with the old one alive.","Now: it recasts when the summon is under 35% HP, has under 2 s left, or is gone.","Wolf, wyvern, lantern and puppet; offline and online."]},"1537|bot|1":{"th":["ระหว่างบาร์ร่ายเต็ม ตัวละครหยุดเดินทุกกรณี (ตามหัวตี้ เดินไปเก็บของ ไล่มอน)","ยกเว้นเดียว: หลบวงสกิลมอนที่เตือนบนพื้น","ออนไลน์คูลดาวน์และดีเลย์หลังร่ายดึงจากเซิร์ฟเวอร์ทุกรอบ พระจึงไม่บัฟซ้ำวนไปมา"],"en":["While a cast bar fills the hero stops moving in every case (following, looting, chasing).","The only exception: stepping out of a monster's ground warning.","Online, cooldowns and after-cast delay come from the server every snapshot, so priests stop re-buffing over and over."]},"1537|bot|2":{"th":["บอทให้คะแนนสกิลจากดาเมจ × จำนวนตัวที่โดน แล้วเรียนจากที่ตีโดนจริง","เดิมตอนออนไลน์นับได้ 0 ตัวทุกสกิล คะแนนตกต่ำสุดหลังใช้ครั้งแรก เลยกดวนแค่ 1–2 ปุ่ม","ตอนนี้นับดาเมจที่เซิร์ฟเวอร์ส่งกลับตามรหัสสกิล (เรียนจาก 3 วิหลังใช้)"],"en":["The bot scores skills by damage × monsters hit and learns from real hits.","Online every skill used to count 0 hits and fell to the minimum score after one cast, so it looped one or two keys.","Now it counts the server's hits under each skill (learned over 3 s after a cast)."]},"1537|bot|3":{"th":["ระยะใช้สกิลประชิดที่ไม่มีระยะของตัวเอง: เดิม 300 คงที่ → ตอนนี้ max(300, ระยะอาวุธ + ขนาดมอน + 20)","อาวุธยิงไกลยังใช้ 520 · สกิลที่มีระยะของตัวเองใช้ 80% ของระยะ ไม่เกิน 720"],"en":["Range for melee skills without their own range: fixed 300 → max(300, weapon reach + monster size + 20).","Ranged weapons stay 520; skills with their own range use 80% of it, up to 720."]},"1537|bot|4":{"th":["เดิม: โดนกระแทกเข้าระหว่างกำแพงกับของตกแต่ง ทุกเส้นทางหาไม่เจอ ยืนโดนตีอยู่ที่เดิม","ตอนนี้: หาทางจากช่องว่างรอบตัว ถ้าไม่มีจะหาจุดที่เดินถึงได้ และถ้าติดนานจะกระโดดออกให้ (ไกลสุด 420)","ใช้กับออโต้ฟาร์ม ออโต้ช่วยตี้ และการตามหัวตี้"],"en":["Before: knocked between a wall and a prop, every path failed and the hero stood there being hit.","Now: it paths from any open cell around, else floods for a reachable spot, and hops you out if stalled (up to 420).","Applies to auto farm, auto support and party follow."]},"1537|bot|5":{"th":["นั่งพัก (ยาหมด) แล้วมีมอนวิ่งเข้ามาตอนเลือดต่ำ: ถอยทันที เดิมลุกตีทีเดียวแล้วนั่งต่อ","คำอธิบายปุ่มถอย: เลือดต่ำกว่า 30% และดื่มยาแดงไม่ได้ = ถอยออกจากฝูง · ไม่มียาเลย = ถอยแล้วนั่งพักจน HP 70% · ปิดปุ่ม = ไม่ถอย ไม่นั่ง","ปิดออโต้แล้วตัวละครลุกขึ้นเอง และหยุดออโต้เควสด้วย","เหยี่ยว: บอทมีคะแนนเฉพาะของเหยี่ยวโฉบ (ดาเมจรวมทุกโฉบ ×1.35 ถ้ามีเหยี่ยวทอง และเพิ่มตามจำนวนมอนรอบเป้าที่ Lv 5+) เดิมแทบไม่เคยส่งเหยี่ยว"],"en":["Sitting to recover (no potions) and a monster comes while HP is low: it backs off at once (it used to stand, swing once, sit again).","The retreat tooltip: HP under 30% and no red potion = step out of the pack · no potions at all = back off and sit to 70% HP · off = no retreat, no sitting.","Turning AUTO off stands you up and stops the quest AUTO too.","Falcon: the bot now scores Falcon Strike on its own (all dives, ×1.35 with the golden falcon, more with monsters round the target at Lv 5+); before it almost never sent the falcon."]},"1537|balance|0":{"th":["ระเบิดเพิ่มต่อครั้งที่ตีเป้าที่ติดดวงไฟ: Lv1 40% · Lv2 45% · Lv3 50% · Lv4 55% · Lv5 60% ของ MATK (เดิม 40% ทุกเลเวล)","ดวงไฟติดอยู่ 6 วิ เท่าเดิม"],"en":["Extra burst per hit on a tagged enemy: Lv1 40% · Lv2 45% · Lv3 50% · Lv4 55% · Lv5 60% of MATK (was 40% at every level).","The tag lasts 6 s, as before."]},"1537|balance|1":{"th":["ดวงไฟที่เกาะเพื่อนกลายเป็นโล่ ดูดซับดาเมจดวงละ 115% (Lv1) ถึง 250% (Lv10) ของ MATK สูงสุด 5 ดวง","เดิมกันได้แค่ตัวผู้เลี้ยงดวงไฟเอง · ตอนนี้กันให้ใครก็ได้ที่มีดวงไฟเกาะ รวมเพื่อน AI","โล่อยู่จนดวงไฟหมดเวลา (20 วิ ถือคทา 30 วิ) ดูดครบ หรือใช้ดวงไฟแตกฮีล · มีไอคอนบัฟบอกเวลาแล้ว"],"en":["Latched wisps become a shield absorbing 115% (Lv1) to 250% (Lv10) of MATK each, up to 5.","Before only the shepherd was protected; now anyone carrying a wisp is, AI allies included.","Lasts until the wisp expires (20 s, 30 s with a staff), is used up, or is burst for a heal; now shown as a timed buff icon."]},"1537|balance|2":{"th":["ยิงใบไม้ทะลุทั้งแนว 1000% ของ ATK (Lv 10) เท่าเดิม","เดิม: วังวนดูดศัตรูเปิดที่ปลายทางเสมอ · ตอนนี้เปิดตรงมอนตัวแรกที่โดน (ครั้งเดียวต่อการยิง) ไม่โดนใครจึงเปิดที่ปลายทาง"],"en":["The piercing leaf shot stays 1000% of ATK (Lv 10).","Before: the pulling vortex always opened at the end of the flight · now it opens on the first monster hit (once per shot), at the end only if nothing is hit."]},"1537|balance|3":{"th":["เดิม: ตอนล้มเวลาบัฟหยุดเดิน แล้วกลับมาทำงานต่อหลังฟื้น","ตอนนี้: ล้มแล้วบัฟทุกอันเป็น 0 ทั้งออฟไลน์และออนไลน์"],"en":["Before: buff timers froze while you were down and resumed on revive.","Now: every buff ends when you fall, offline and online."]},"1537|balance|4":{"th":["ธนู กระสุน เวท และสกิลยิงข้ามบ่อน้ำได้ (เดิมหยุดที่ริมน้ำ) เดินข้ามน้ำยังไม่ได้","ออโต้ก็นับว่ายิงข้ามน้ำได้ · มอนริมบ่อตีง่ายขึ้น"],"en":["Arrows, bullets, bolts and skill shots fly over ponds (they used to stop at the shore); walking across still doesn't.","AUTO treats water as clear too; monsters by a pond are easier to hit."]},"1537|items|0":{"th":["สีแสง: ทองแดงส้มอ่อน เหล็กฟ้าเทา เงินขาวฟ้า (ตัวเลข Lv/HP/XP ของสายแร่เท่าเดิม: ทองแดง 1/7/14 · เหล็ก 6/9/24 · เงิน 13/11/40)","ปุ่มขุดขึ้นแม้กำลังสู้ (เดิมขึ้นเฉพาะปลูกผัก)","ออนไลน์: สายแร่ที่คนอื่นกำลังขุดไม่ขึ้นปุ่ม ขุดแล้วเห็นเป็นเศษหิน · เริ่มขุดหลังตัวหยุดเดินและอยู่ในระยะ"],"en":["Glow colours: copper soft orange, iron grey-blue, silver blue-white (vein Lv/HP/XP unchanged: copper 1/7/14 · iron 6/9/24 · silver 13/11/40).","The mine prompt shows even during a fight (before, only farming did).","Online: veins others are working show no prompt and mined ones draw as rubble; mining starts once you stand still in reach."]},"1537|items|1":{"th":["นับสเตตัสจากแถวออปชั่น: STR AGI VIT INT DEX LUK HIT FLEE แสดงเป็น \"(ออป +N)\"","ของที่ไม่ใช่อาวุธแสดงได้ถึง 5 แถว (เดิม 3) · แสดงผลอย่างเดียว ค่าจริงไม่เปลี่ยน"],"en":["Option-row stats count: STR AGI VIT INT DEX LUK HIT FLEE, shown as \"(opt +N)\".","Non-weapons show up to 5 rows (was 3); display only, real stats unchanged."]},"1537|items|2":{"th":["การ์ดกระเป๋ามีปุ่ม \"ไปฝากคลัง\" และ \"เดินไปเบิกที่ลุงโกโก้\" พาเดินไปเอง","แท็บคลังบอกวิธีใช้ · กระเป๋าเต็มปุ่มเบิกขึ้น \"กระเป๋าเต็ม\" · ของที่ใส่อยู่ฝากไม่ได้ · ปุ่มฝากขึ้นเฉพาะที่ร้าน"],"en":["Bag cards get \"go deposit\" and \"walk to Coco to withdraw\" buttons that walk you there.","The storage tab explains itself; withdraw says \"bag full\" when full; worn items can't be deposited; deposit shows only at the shop."]},"1537|online|0":{"th":["เดิม: สัตว์เรียกบนจอเป็นตัวจำลองในเครื่อง ตีกันเองแต่ไม่มีผล ส่วนตัวจริงของเซิร์ฟเวอร์มองไม่เห็น","ตอนนี้: เห็นตัวจริงจากเซิร์ฟเวอร์ ดาเมจที่เห็นตรงกับที่โดนจริง รวมด้าย ตะขอ และท่าของหุ่นเชิด"],"en":["Before: summons on screen were local copies whose hits did nothing, while the server's real ones fought unseen.","Now: you see the server's own summons and their real hits, including the puppeteer's wires, hooks and moves."]},"1537|online|1":{"th":["คูลดาวน์และดีเลย์หลังร่ายดึงจากเซิร์ฟเวอร์ทุกรอบ แก้ \"ใช้สกิลไม่ได้\" ตอนกดซ้ำ","ยิงโดนตรงที่เห็น: เครื่องส่งจังหวะที่วาดมอนทุก 1 วิ (เดิม 2) เซิร์ฟเวอร์ย้อนได้ไม่เกิน 0.5 วิ","ตัวเลขดาเมจหลายดอกในจังหวะเดียวแยกเป็นหลายตัวเหมือนออฟไลน์"],"en":["Cooldowns and after-cast delay sync from the server every snapshot, fixing \"skill unavailable\" on re-press.","Shots land where you see them: the client reports the drawn tick every 1 s (was 2), the server looks back up to 0.5 s.","Several hits in one tick now show as separate numbers, as offline."]},"1537|online|2":{"th":["เห็นสถานะออนไลน์ แมพ แชนแนล และหน้าตาของเพื่อนกิลด์ที่อยู่แมพอื่น","เวลา \"ออนไลน์ล่าสุด\" แก้หน่วยจากวินาทีเป็นมิลลิวินาที จึงไม่เป็นปี 1970"],"en":["See online status, map, channel and look of guild mates on other maps.","\"Last seen\" now converts seconds properly, so it no longer reads 1970."]},"1537|online|3":{"th":["ถ้าเซิร์ฟเวอร์กำหนดเวอร์ชันแอปขั้นต่ำใหม่ จะมีหน้าจอบังพร้อมปุ่มดาวน์โหลด เกมและออโต้หยุด · ย้ายแชนแนลจะเช็คก่อน","ย่อหน้าต่าง: เกมเดินต่อ (ออโต้และข้อมูลออนไลน์) แต่ไม่วาดภาพ ช่วงไล่ทันต่อจังหวะเพิ่มจาก 0.25 เป็น 1.2 วิ · หน้าต่างที่ถูกบังหรืออยู่จอที่สองยังวาดปกติ","เล่นบนเว็บไม่โดนผล"],"en":["If the server raises the minimum app build, a blocking screen with a download button appears and the game and AUTO stop; switching channel checks first.","Minimised: the game keeps stepping (AUTO, online traffic) without drawing; catch-up per tick 0.25 → 1.2 s; a covered window or one on a second monitor still draws.","Web players are unaffected."]},"1537|online|4":{"th":["ส่วน \"ลองอาชีพ\" ในเมนู ESC ถูกถอดสำหรับทุกคน มีส่วน \"สิทธิ์และแอสเซ็ต\" พร้อมลิงก์ข้อกำหนดแทน","หน้าเติมเพชร: ตัดคำว่า \"โหมดทดสอบ\" ราคาแพ็กเท่าเดิม"],"en":["The ESC menu's \"try a job\" section is gone for everyone; a \"rights and assets\" section with the terms link takes its place.","Top-up page: the \"test mode\" labels are gone; pack prices unchanged."]},"1537|fix|1":{"th":["เควสเนื้อเรื่องที่รับไว้ขึ้นบนสุด บทเรียนอยู่ข้างล่าง","ขั้นที่ต้องใช้แต้มสกิล/สเตตัส ขึ้น \"รอขึ้นเลเวล / รอขึ้น Job Lv\" และออโต้เควสจะเล่นเควสเนื้อเรื่องแทนการไปฟาร์มรอ"],"en":["The taken story quest shows first, the lesson under it.","Steps that need a skill or stat point say \"wait for a level / job level\", and the quest AUTO plays the story quest instead of farming for it."]},"1537|fix|2":{"th":["แผงร้านผู้เล่น: หน้าต่างซื้อไม่วาดใหม่ระหว่างกดค้าง (รอสูงสุด 1.5 วิ) คลิกจึงไม่หลุด","กระซิบไม่ถึงบอกเหตุผล: ออฟไลน์ ชื่อซ้ำหลายคน หรือกระซิบหาตัวเอง","บัฟที่ต้องถืออาวุธอื่นจะจาง และบอกว่าต้องถืออะไร"],"en":["Player stalls: the buy window no longer redraws between press and release (waits up to 1.5 s), so clicks stick.","Failed whispers say why: offline, several players with that name, or yourself.","Buffs needing another weapon are dimmed and say which weapon."]},"1537|fix|3":{"th":["ATK แสดงตัวคูณดาเมจ ×N.NN จากของและบัฟ · แถวพลังโจมตี/พลังสกิลรวมทุกแหล่ง (ตีบวก แถวอาวุธ โบนัสเซ็ต ติดตัว บัฟ) เดิมนับแค่ของ","ชำนาญดาบ: ดาบ ดาบใหญ่ ขวาน กระบอง ใช้ได้ · ดาบคู่ไม่นับ (ในเกมเป็นแบบนี้อยู่แล้ว แค่เขียนให้ชั
