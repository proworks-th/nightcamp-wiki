<style>
:root{--bg:#eef0f6;--panel:#fff;--line:#c9cfdf;--fg:#18203a;--muted:#56607c;--ember:#c4561a;--moon:#3c4fa8;--display:'Mitr','Noto Sans Thai',system-ui,sans-serif;--body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10132a;--panel:#181c38;--line:#2f3563;--fg:#e9ebf7;--muted:#a3a9cc;--ember:#f59a4c;--moon:#aab8ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10132a;--panel:#181c38;--line:#2f3563;--fg:#e9ebf7;--muted:#a3a9cc;--ember:#f59a4c;--moon:#aab8ff;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--body)}
body{display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{color:var(--fg);text-decoration:none;font:600 17px var(--display);white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand img{height:34px;width:auto;display:block}
.brand span{color:var(--ember)}
nav.grp{display:flex;gap:4px;position:relative;z-index:20}
.dd{position:relative}
.ddb{display:flex;align-items:center;gap:6px;font:500 15px var(--display);min-height:42px;padding:6px 14px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--fg);cursor:pointer}
.ddb svg{width:10px;height:6px;transition:transform .15s}
.ddb[aria-selected="true"]{color:var(--ember);border-color:var(--line);background:var(--bg)}
.dd.open .ddb svg{transform:rotate(180deg)}
.ddm{position:absolute;left:0;top:100%;min-width:210px;margin-top:4px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.28);display:none;flex-direction:column}
.ddm::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px}
.dd.open .ddm{display:flex}
@media (hover:hover){.dd:hover .ddm{display:flex}.dd:hover .ddb svg{transform:rotate(180deg)}.ddb:hover{background:var(--bg)}}
.ddm button{text-align:left;font:500 15px var(--display);min-height:42px;padding:8px 12px;border:0;border-radius:8px;background:none;color:var(--fg);cursor:pointer;white-space:nowrap}
.ddm button:hover{background:var(--bg)}
.ddm button[aria-current="page"]{color:var(--ember);background:var(--bg)}
.ddm button[aria-current="page"]::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ember);margin-right:8px;vertical-align:middle}
.here{font:500 14px var(--display);color:var(--muted);white-space:nowrap}
.lang{margin-left:auto}
.me{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px}
.me label{color:var(--muted)}
.me select,.me input{font:15px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 8px;min-height:40px}
.me select{max-width:170px}
.me input{width:64px}
.lang{font:600 14px var(--display);min-height:40px;min-width:48px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
iframe{flex:1;width:100%;border:0;display:block}
.stage{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.skel{position:absolute;inset:0;background:var(--bg);padding:24px 16px;overflow:hidden;transition:opacity .25s}
.skel.done{opacity:0;pointer-events:none}
.skel .in{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.skel i{display:block;border-radius:12px;background:linear-gradient(90deg,var(--line) 0%,var(--panel) 50%,var(--line) 100%);background-size:200% 100%;animation:sk 1.2s ease-in-out infinite;opacity:.55}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.skel i{animation:none}}
html,body{overflow-x:hidden}
.me select{min-width:0}
.sbtn{display:none;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}.sbtn svg{width:18px;height:18px}
/* a phone: everything on one row (logo, the three menus, search, language); the search box opens under it */
@media (max-width:720px){header{gap:6px;padding:6px 10px;flex-wrap:wrap}.brand span{display:none}.brand img{height:28px}.here{display:none}
  nav.grp{flex:1;gap:0;min-width:0}.ddb{padding:6px 7px;font-size:14px;gap:3px}.dd:last-child .ddm{left:auto;right:0}
  .sbtn{display:grid;margin-left:auto}.lang{min-width:40px;padding:0 6px;margin-left:0}
  header .sx{display:none;order:9!important;flex:1 1 100%!important;max-width:none}header.sopen .sx{display:block}}
@media (max-width:360px){.ddb{padding:6px 5px;font-size:13.5px}.ddb svg{display:none}}
</style>
<style>/* shared by every page (site.py puts it in each head): where a number comes from, and "how to read this" */
.src{display:inline-block;font:600 11px/1.6 var(--body,system-ui);padding:0 7px;border-radius:999px;vertical-align:middle;white-space:nowrap;letter-spacing:.2px}
.src.game{background:color-mix(in srgb,var(--moon,#3c4fa8) 14%,transparent);color:var(--moon,#3c4fa8)}
.src.est{background:color-mix(in srgb,var(--ember,#c4561a) 16%,transparent);color:var(--ember,#c4561a)}
details.howto{margin:10px 0;border:1px solid var(--line,#c9cfdf);border-radius:12px;background:var(--panel,#fff);font-size:14px}
details.howto>summary{cursor:pointer;padding:8px 12px;font-weight:600;list-style:none}
details.howto>summary::-webkit-details-marker{display:none}
details.howto>summary::before{content:"ⓘ ";color:var(--moon,#3c4fa8)}
details.howto>ul{margin:0;padding:0 14px 6px 30px}
details.howto li{margin:4px 0}
details.howto>p{margin:0;padding:4px 12px 10px;color:var(--muted,#56607c);font-size:13px}
.wk{white-space:nowrap}
</style><style>/* touch screens: every control at least 44 x 44 CSS px (Apple / Android guidance), links in lists and tables at least
   24 px tall (WCAG 2.2 target size). Only on touch (pointer: coarse); the desktop look is unchanged. Loaded after each
   page's own style, so it wins; !important only on the sizes, because some widgets add their style later. */
@media (pointer: coarse) {
  button, select, summary, [role=button], .btn, .chip, a.btn,
  input:not([type=checkbox]):not([type=radio]):not([type=hidden]):not([type=range]) { min-height: 44px !important; }
  button, [role=button], .btn, .chip, a.btn, select { min-width: 44px !important; }
  summary { display: list-item; padding-block: 10px; box-sizing: border-box; }
  label:has(> input[type=checkbox]), label:has(> input[type=radio]) { display: inline-flex; align-items: center; gap: 8px; min-height: 44px !important; }
  a.brand, #brand, .ddm a, [role=menuitem] { display: inline-flex; align-items: center; min-height: 44px !important; }
  .ddm a, [role=menuitem] { display: flex; }
  /* plain links: 4 px above and below (an inline link's padding grows its tap area without moving the text); :where()
     keeps this weaker than any padding a page sets itself */
  :where(a[href]:not(.btn):not(.chip)) { padding-block: 4px; }
  a.kt { padding-block: 4px; }   /* the skill-kind tags on the wiki (links drawn as small tags) */
}
</style></head>

<script>
const TABS = ["home", "guide", "patch", "about", "jobs", "equip", "mon", "map", "life", "rune", "me", "sim", "plan", "calc", "boss"], F = Object.fromEntries(TABS.map((x) => [x, document.getElementById('f-' + x)]));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let P = (() => { try { return JSON.parse(store.get('nc_profile') || 'null'); } catch (e) { return null; } })() || { job: 'knight', lv: 10 };
function send(x, extra) { try { F[x].contentWindow.postMessage(Object.assign({ nc: 'profile', profile: P }, extra || {}), '*'); } catch (e) {} }
function setP(job, lv, except) {
  P = { job: job || P.job, lv: Math.max(1, Math.min(99, +lv || P.lv)) };
  store.set('nc_profile', JSON.stringify(P));
  for (const x of TABS) if (x !== except) send(x);
}
const READY = {}, WAIT = {};
// a page loads the first time it is needed; toSim runs once the frame is up
function ensure(x) { if (!F[x].getAttribute('src')) F[x].setAttribute('src', F[x].dataset.src); }
function whenReady(x, fn) { ensure(x); if (READY[x]) fn(); else (WAIT[x] = WAIT[x] || []).push(fn); }
const SK = document.getElementById('skel');
const skel = () => SK.classList.toggle('done', !!READY[CUR]);
for (const x of TABS) F[x].addEventListener('load', () => { READY[x] = true; skel(); send(x); for (const fn of WAIT[x] || []) setTimeout(fn, 30); WAIT[x] = []; });
let CUR = 'home';
const VG = {"home": "guide", "guide": "guide", "patch": "guide", "about": "guide", "jobs": "data", "equip": "data", "mon": "data", "map": "data", "life": "data", "rune": "data", "me": "tools", "sim": "tools", "plan": "tools", "calc": "tools", "boss": "tools"}, LASTG = (() => { try { return JSON.parse(store.get('nc_lastg') || '{}'); } catch (e) { return {}; } })();
function go(t, force) {
  if (!TABS.includes(t)) t = 'home';
  CUR = t; ensure(t); skel();
  const g = VG[t]; LASTG[g] = t; store.set('nc_lastg', JSON.stringify(LASTG));
  for (const b of document.querySelectorAll('.ddb')) b.setAttribute('aria-selected', b.dataset.g === g);
  closeMenus(); document.getElementById('here').textContent = '› ' + document.getElementById('t-' + t).textContent;
  for (const x of TABS) { const b = document.getElementById('t-' + x); if (x === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); F[x].hidden = x !== t; }
  if (force) send(t, { force: true });
  try { if (location.hash.slice(1).split('/')[0] !== t) history.replaceState(null, '', '#' + t); } catch (e) {}
}
for (const x of TABS) document.getElementById('t-' + x).onclick = () => go(x);
// the logo: back to the main page
document.getElementById('brand').onclick = (e) => { e.preventDefault(); go(TABS.includes('home') ? 'home' : TABS[0]); };
window.addEventListener('hashchange', () => { const h = location.hash.slice(1).split('/')[0]; if (h && h !== CUR && TABS.includes(h)) go(h); });
// the drop-downs: hover opens them on a computer (CSS); a tap or a click toggles; a click elsewhere or Esc closes
function closeMenus(except) { for (const d of document.querySelectorAll('.dd')) if (d !== except) { d.classList.remove('open'); d.querySelector('.ddb').setAttribute('aria-expanded', 'false'); } }
for (const b of document.querySelectorAll('.ddb')) b.onclick = (e) => { e.stopPropagation(); const d = b.parentElement, o = !d.classList.contains('open'); closeMenus(d); d.classList.toggle('open', o); b.setAttribute('aria-expanded', o); if (o) d.querySelector('[aria-current="page"], .ddm button').focus({ preventScroll: true }); };
document.addEventListener('click', () => closeMenus());
window.addEventListener('blur', () => setTimeout(() => { if (document.activeElement && document.activeElement.tagName === 'IFRAME') closeMenus(); }, 0));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenus(); });
window.addEventListener('message', (e) => {
  const d = e.data || {}, from = TABS.find((x) => F[x].contentWindow === e.source);
  if (!from) return;
  if (d.nc === 'setProfile' && d.profile) setP(d.profile.job, d.profile.lv, from);
  if (d.nc === 'nav' && TABS.includes(d.tab)) go(d.tab, d.tab === 'sim');
  if (d.nc === 'search' && d.q) search(d.q);
  if (d.nc === 'open' && TABS.includes(d.tab) && d.msg) { whenReady(d.tab, () => F[d.tab].contentWindow.postMessage(d.msg, '*')); go(d.tab); }
  if (d.nc === 'plan' && d.item && TABS.includes('plan')) { whenReady('plan', () => F.plan.contentWindow.postMessage({ nc: 'find', item: d.item }, '*')); go('plan'); }
  if (d.nc === 'gear' && from === 'equip') { whenReady('sim', () => F.sim.contentWindow.postMessage(d, '*')); setTimeout(() => go('sim'), 700); }
  if (d.nc === 'build' && ['guide', 'jobs', 'me'].includes(from) && d.code) { whenReady('sim', () => F.sim.contentWindow.postMessage(d, '*')); go('sim'); try { history.replaceState(null, '', '#sim/' + d.code); } catch (e) {} }
});
const LANG = (() => { try { return localStorage.getItem('nc_lang') || 'th'; } catch (e) { return 'th'; } })();
const lb = document.getElementById('langBtn'); lb.textContent = LANG === 'en' ? 'ไทย' : 'EN';
// switching language reloads the page; come back to the tab you were on (the hash may not survive every viewer)
lb.onclick = () => { try { localStorage.setItem('nc_lang', LANG === 'en' ? 'th' : 'en'); localStorage.setItem('nc_tab_once', CUR); } catch (e) {} location.reload(); };
let back = '';
try { back = localStorage.getItem('nc_tab_once') || ''; localStorage.removeItem('nc_tab_once'); } catch (e) {}
// a shared build link: #sim/NCB1.… opens that build in the Build Sim
const linkCode = (/^#sim\/(NCB1\.[A-Za-z0-9+/]+)$/.exec(location.hash) || [])[1];
if (linkCode) whenReady('sim', () => F.sim.contentWindow.postMessage({ nc: 'build', code: linkCode, name: 'Build จากลิงก์' }, '*'));
// a map from a wiki page: #map/<id> opens the map with that place picked
// the phone's search button: the box opens under the row
const HD = document.querySelector('header'), SB = document.getElementById('sBtn');
function openSearch(on = true) { HD.classList.toggle('sopen', on); SB.setAttribute('aria-expanded', on); if (on) setTimeout(() => document.getElementById('sq').focus(), 0); }
SB.onclick = () => openSearch(!HD.classList.contains('sopen'));
// a search from the main page (or a #search/<words> link): fill the box and show the results
function search(q) { openSearch(); const i = document.getElementById('sq'); i.value = String(q).slice(0, 80); i.focus(); i.dispatchEvent(new Event('input', { bubbles: true })); }
const sLink = (/^#search\/(.+)$/.exec(location.hash) || [])[1];
if (sLink) setTimeout(() => search(decodeURIComponent(sLink)), 50);
const mapLink = (/^#map\/([a-z0-9_]+)$/.exec(location.hash) || [])[1];
if (mapLink && TABS.includes('map')) whenReady('map', () => F.map.contentWindow.postMessage({ nc: 'find', map: mapLink }, '*'));
go(back || (linkCode ? 'sim' : mapLink ? 'map' : location.hash.slice(1)));
</script>

<script>
document.addEventListener('load', (e) => { const w = e.target.closest && e.target.closest('.sic.sk'); if (w) w.classList.remove('sk'); }, true);
document.addEventListener('error', (e) => { const w = e.target.closest && e.target.closest('.sic.sk'); if (w) { w.classList.remove('sk'); e.target.remove(); } }, true);
// site-wide search: one box for items (and their stats: "crit"), monsters, options, jobs, skills, spots, guide tips, patch notes
(function () {
  const box = document.getElementById('sq'), res = document.getElementById('sres');
  const EN = LANG === 'en';
  box.placeholder = EN ? 'Search everything: crit, slime, a skill…' : 'ค้นทั้งเว็บ เช่น crit, สไลม์, ชื่อสกิล…';
  const KIND = { job: ['อาชีพ', 'Jobs'], skill: ['สกิล', 'Skills'], item: ['อุปกรณ์', 'Equipment'], opt: ['ออปชั่นสุ่มบนอุปกรณ์', 'Random equipment options'],
    mon: ['มอนสเตอร์', 'Monsters'], map: ['แมพ', 'Maps'], spot: ['จุดเก็บเลเวล', 'Leveling spots'], life: ['อาชีพเสริม', 'Life skills'], rune: ['รูนจารึกสกิล', 'Skill runes'], sec: ['คู่มือ', 'Guide'], patch: ['อัปเดตเกม', 'Patch notes'] };
  const ORDER = ['item', 'opt', 'job', 'skill', 'rune', 'mon', 'map', 'life', 'spot', 'sec', 'patch'], MAX = { item: 6, mon: 4, skill: 5 };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let SYN = [], IDX = null, loading = null, hits = [], act = -1;
  function load() {
    if (IDX || loading) return loading;
    loading = fetch(box.dataset.src).then((r) => r.json()).then((d) => {
      SYN = d.syn;
      IDX = d.rows.map((r) => { let h = (r[1] + ' ' + r[2] + ' ' + r[3]).toLowerCase(); const add = []; for (const g of d.syn) if (g.some((w) => h.includes(w))) add.push(...g); return { r, nm: (r[1] + ' ' + r[2]).toLowerCase(), h: h + ' ' + add.join(' ') }; });
      if (box.value.trim()) find();
    }).catch(() => { loading = null; res.innerHTML = `<div class="none">${EN ? 'Search could not load. Try again.' : 'โหลดข้อมูลค้นหาไม่ได้ ลองใหม่อีกครั้ง'}</div>`; res.hidden = false; });
    return loading;
  }
  // highlight the words typed and their same-meaning words ("crit" lights up "คริ +5%")
  const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function mark(s, toks) {
    const W = new Set(toks.filter((t) => t.length > 1));
    for (const g of SYN) if (toks.some((t) => g.includes(t) || (t.length > 2 && g.some((w) => w.startsWith(t))))) g.forEach((w) => W.add(w));
    if (!W.size) return esc(s);
    const re = new RegExp([...W].sort((a, b) => b.length - a.length).map(reEsc).join('|'), 'gi');
    let o = '', i = 0, m; const str = String(s);
    while ((m = re.exec(str))) { o += esc(str.slice(i, m.index)) + '<mark>' + esc(m[0]) + '</mark>'; i = m.index + m[0].length; if (!m[0].length) re.lastIndex++; }
    return o + esc(str.slice(i));
  }
  // English viewers: translate the small lines part by part (the page dictionary knows the parts, not the whole line)
  const PRE = { 'เสื้อ+กางเกง': 'Top + pants', 'ครบ 3 ชิ้น': 'Full set', 'ติดได้ที่': 'Rolls on', 'สูงสุด': 'max', 'มอน': 'Monsters', 'คู่มือ': 'Guide' };
  const TR = (s) => {
    if (!EN || !s || !window.NC_TR) return s;
    return String(s).split(' / ').map((part) => part.split(' · ').map((seg) => {
      const m = /^([^:]+):\s*(.*)$/.exec(seg); if (m && PRE[m[1]]) return PRE[m[1]] + ': ' + TR(m[2]);
      const w = /^(\S+)\s(.+)$/.exec(seg); if (w && PRE[w[1]]) return PRE[w[1]] + ' ' + TR(w[2]);
      return window.NC_TR(seg);
    }).join(' · ')).join(' / ');
  };
  function find() {
    const q = box.value.trim().toLowerCase();
    if (!q) { close(); return; }
    if (!IDX) { load(); res.innerHTML = `<div class="none">${EN ? 'Loading…' : 'กำลังโหลด…'}</div>`; res.hidden = false; return; }
    const toks = q.split(/\s+/);
    const by = {};
    for (const x of IDX) {
      if (!toks.every((t) => x.h.includes(t))) continue;
      const nm = x.nm, s = nm === q ? 100 : nm.startsWith(q) ? 70 : nm.includes(q) ? 50 : toks.every((t) => nm.includes(t)) ? 40 : 10;
      (by[x.r[0]] = by[x.r[0]] || []).push([s, x.r]);
    }
    hits = []; let html = '';
    // equipment first (the usual question: "which items have crit?"), unless another kind has that exact name
    const exact = (k) => by[k].some((z) => z[0] === 100);
    // a kind whose name starts with the words (or is them) comes first: "โอเอซิส" finds the map before monsters living there
    const top = (k) => { const m = Math.max(...by[k].map((z) => z[0])); return m >= 70 ? m : 0; };
    const kinds = ORDER.filter((k) => by[k]).sort((a, b) => top(b) - top(a) || ORDER.indexOf(a) - ORDER.indexOf(b));
    for (const k of kinds) {
      const L = by[k].sort((a, b) => b[0] - a[0] || a[1][1].length - b[1][1].length), n = MAX[k] || 4;
      html += `<h4>${KIND[k][EN ? 1 : 0]} · ${L.length.toLocaleString()}</h4>`;
      for (const [, r] of L.slice(0, n)) {
        const name = EN && r[2] ? r[2] : r[1];
        const tx = `<b>${mark(name, toks)}</b>${r[5].sub ? `<small>${esc(TR(r[5].sub))}</small>` : ''}${r[5].x ? `<small class="x">${mark(TR(r[5].x), toks)}</small>` : ''}`;
        html += r[5].ic ? `<a role="option" class="hic" data-i="${hits.length}"><span class="sic sk"><${'img'} alt="" decoding="async" src="img/ic/${esc(r[5].ic)}.webp"></span><span class="stx">${tx}</span></a>` : `<a role="option" data-i="${hits.length}">${tx}</a>`;
        hits.push(r);
      }
      if (k === 'item' && L.length > n) { html += `<a role="option" class="all" data-i="${hits.length}"><b>${EN ? `See all ${L.length} matching items →` : `ดูอุปกรณ์ทั้ง ${L.length} ชิ้นที่ตรงกับ “${esc(q)}” →`}</b></a>`; hits.push(['all', q, '', '', 'equip', { q }]); }
    }
    res.innerHTML = html || `<div class="none">${EN ? `Nothing found for “${esc(q)}”` : `ไม่เจอ “${esc(q)}” ลองคำอื่น เช่น ชื่อไทย/อังกฤษ หรือค่าสถานะ (crit, ตีเร็ว, hp)`}</div>`;
    res.hidden = false; act = hits.length ? 0 : -1; paint();
  }
  function paint() { for (const a of res.querySelectorAll('a')) a.setAttribute('aria-selected', +a.dataset.i === act); const a = res.querySelector(`a[data-i="${act}"]`); if (a) a.scrollIntoView({ block: 'nearest' }); }
  function close() { res.hidden = true; act = -1; }
  function open(r) {
    if (!r) return;
    if (r[5] && r[5].w) { close(); location.href = r[5].w; return; } // (a thing with its own wiki page opens that page)
    const tab = r[4], msg = Object.assign({ nc: 'find' }, r[5]);
    if (msg.q === 1) msg.q = r[1];
    delete msg.sub; delete msg.x;
    close(); box.blur();
    go(tab);
    whenReady(tab, () => F[tab].contentWindow.postMessage(msg, '*'));
  }
  let t = 0;
  box.addEventListener('focus', load);
  box.addEventListener('input', () => { clearTimeout(t); t = setTimeout(find, 120); });
  box.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' && hits.length) { e.preventDefault(); if (res.hidden) find(); act = (act + 1) % hits.length; paint(); }
    else if (e.key === 'ArrowUp' && hits.length) { e.preventDefault(); act = (act - 1 + hits.length) % hits.length; paint(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (res.hidden) find(); else open(hits[Math.max(0, act)]); }
    else if (e.key === 'Escape') { close(); }
  });
  res.addEventListener('mousedown', (e) => e.preventDefault()); // keep the focus in the box while clicking a result
  res.addEventListener('click', (e) => { const a = e.target.closest('a[data-i]'); if (a) open(hits[+a.dataset.i]); });
  box.addEventListener('blur', () => setTimeout(close, 120));
  document.addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement !== box && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); box.focus(); } });
  // pages ask for a search too (e.g. a "/" typed inside a page)
  window.addEventListener('message', (e) => { const d = e.data || {}; if (d.nc === 'focusSearch' && TABS.some((x) => F[x].contentWindow === e.source)) box.focus(); });
})();
</script>

<script>/* English mode: when the viewer picked EN (localStorage nc_lang), swap the Thai interface text for English as the page
   renders. Game names that have no official English (items, monsters) stay Thai. */
(function () {
  var lang = 'th';
  try { lang = localStorage.getItem('nc_lang') || 'th'; } catch (e) {}
  if (lang !== 'en') return;
  // the dictionary is its own file (i18n.js sets window.NC_I18N), fetched only for English viewers
  if (window.NC_I18N) return start(window.NC_I18N);
  var sc = document.createElement('script');
  sc.src = 'i18n.js?v=1ae811bf'; sc.onload = function () { if (window.NC_I18N) start(window.NC_I18N); };
  document.head.appendChild(sc);
  function start(I) {
  document.documentElement.lang = 'en';
  // the English name beside a Thai name would say the same thing twice; and the "more/less" labels drawn by CSS
  var st = document.createElement('style');
  st.textContent = '.en2{display:none!important}' + (document.querySelector('nav.ch') ? ' details>summary::after{content:"More \\25BE"!important} details[open]>summary::after{content:"Hide \\25B4"!important}' : '');
  document.head.appendChild(st);
  var TH = /[฀-๿]/, NUM = /\d[\d,]*(?:\.\d+)?/g;
  var R = I.r.map(function (x) { return [new RegExp(x[0]), x[1], !!x[2]]; });
  var WK = Object.keys(I.w).sort(function (a, b) { return b.length - a.length; });
  var memo = new Map();
  function core(c) {
    if (!TH.test(c)) return c;
    if (I.x[c] != null) return I.x[c];
    var nums = c.match(NUM) || [], n = c.replace(NUM, '{n}');
    if (I.x[n] != null) { var i = 0; return I.x[n].replace(/\{n\}/g, function () { return nums[i++] != null ? nums[i - 1] : ''; }); }
    // lists first: "a · b" and "a, b" are translated part by part (a repeated name like "Shinobi · Shinobi" collapses)
    var sep = c.indexOf(' · ') >= 0 ? ' · ' : c.indexOf(', ') >= 0 && !/[()]/.test(c) ? ', ' : null;
    if (sep) {
      var parts = c.split(sep).map(function (p) { var t = core(p.trim()); return t == null ? p : t; });
      if (sep === ' · ' && parts.length === 2 && parts[0] === parts[1]) return parts[0];
      if (parts.some(function (p, i) { return p !== c.split(sep)[i]; })) return parts.join(sep);
    }
    for (var k = 0; k < R.length; k++) {
      var g = c.match(R[k][0]);
      if (!g) continue;
      var ok = true, raw = R[k][2];
      var res = R[k][1].replace(/\{(\d)\}/g, function (_, d) { var v = g[+d] || ''; var t = core(v); if (t == null) { if (!raw) ok = false; return v; } return t; });
      if (ok) return res;
    }
    var w = c;
    for (var j = 0; j < WK.length; j++) if (w.indexOf(WK[j]) >= 0) w = w.split(WK[j]).join(I.w[WK[j]]);
    if (!TH.test(w)) return w;
    return null;
  }
  function tr(s) {
    if (!s || !TH.test(s)) return s;
    if (memo.has(s)) return memo.get(s);
    var m = s.match(/^(\s*)([\s\S]*?)(\s*)$/), out = core(m[2]);
    var r = out == null ? s : m[1] + out + m[3];
    memo.set(s, r);
    return r;
  }
  var ATTR = ['placeholder', 'title', 'aria-label'];
  function el(e) {
    for (var a = 0; a < ATTR.length; a++) { var v = e.getAttribute && e.getAttribute(ATTR[a]); if (v && TH.test(v)) { var t = tr(v); if (t !== v) e.setAttribute(ATTR[a], t); } }
  }
  function walk(root) {
    if (root.nodeType === 3) { text(root); return; }
    if (root.nodeType !== 1 || /^(SCRIPT|STYLE|TEXTAREA)$/.test(root.tagName)) return;
    el(root);
    var it = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT), n;
    while ((n = it.nextNode())) {
      if (n.nodeType === 3) text(n);
      else if (!/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.tagName)) el(n);
    }
  }
  function text(n) {
    var p = n.parentNode;
    if (!p || /^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName)) return;
    var v = n.nodeValue, t = tr(v);
    if (t !== v) n.nodeValue = t;
  }
  if (TH.test(document.title)) document.title = tr(document.title);
  walk(document.body);
  new MutationObserver(function (ms) {
    for (var i = 0; i < ms.length; i++) {
      var m = ms[i];
      if (m.type === 'characterData') text(m.target);
      else if (m.type === 'attributes') el(m.target);
      else for (var j = 0; j < m.addedNodes.length; j++) walk(m.addedNodes[j]);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTR });
  window.NC_TR = tr;
  }
})();
</script>
