<style>

:root{
  --bg:#eef0f6; --panel:#ffffff; --panel2:#e3e7f1; --line:#c9cfdf; --fg:#18203a; --muted:#56607c;
  --ember:#c4561a; --ember-soft:#f6dcc8; --moon:#3c4fa8; --moon-soft:#dfe4fb;
  --good:#2f8a55; --good-soft:#dcefe3; --warn:#b26a00; --bad:#b33a3a;

}

  --bg:#10132a; --panel:#181c38; --panel2:#20254a; --line:#2f3563; --fg:#e9ebf7; --muted:#a3a9cc;

  --bg:#10132a; --panel:#181c38; --panel2:#20254a; --line:#2f3563; --fg:#e9ebf7; --muted:#a3a9cc;
  --ember:#f59a4c; --ember-soft:#3a2a2a; --moon:#aab8ff; --moon-soft:#262d5c; --good:#6fd39a; --good-soft:#1d3a2c; --warn:#f2b552; --bad:#ff8a8a;

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 48px}
header.top{padding-block:20px 8px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0}
h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0;line-height:1.3}
h3{font-family:var(--display);font-weight:500;font-size:16.5px;margin:0 0 8px}
.kicker{font:600 11px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--ember)}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.rail{position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line)}
.skills{display:flex;gap:6px;flex-wrap:wrap}
.skills button{display:inline-flex;align-items:center;gap:8px;font:500 15px var(--display);border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:6px 16px 6px 8px;min-height:42px;cursor:pointer}
.skills button i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 12px var(--display);font-style:normal;background:var(--k)}
.skills button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);margin-top:14px}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.hero{border-left:5px solid var(--k)}
.hero p{margin:6px 0 0}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fact{font-size:13px;background:var(--panel2);border-radius:999px;padding:3px 10px}
.fact b{font-weight:600}
ul.rules{margin:10px 0 0;padding-left:20px} ul.rules li{margin:4px 0}
.me{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.stat{background:var(--panel2);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:600 19px var(--mono);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12.5px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--k)}
.best{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--good-soft)}
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.tier{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.tier .tn{font:600 11px var(--mono);color:var(--k)}
.tier b{display:block;font:500 15px var(--display);margin:2px 0 4px}
.tier.have{border-color:var(--k);box-shadow:inset 0 0 0 1px var(--k)}
.tier small{display:block;color:var(--muted);font-size:12.5px}
.perks{display:flex;flex-direction:column;gap:6px}
.perk{display:flex;gap:10px;align-items:baseline;font-size:14px}
.perk .lv{flex:0 0 52px;font:600 12px var(--mono);color:var(--muted)}
.perk.on .lv{color:var(--good)}
.perk.off{color:var(--muted)}
.sec{margin-top:14px}
.shead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;margin:18px 0 8px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11.5px var(--mono);color:var(--muted);background:var(--panel2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);white-space:nowrap}
td.nm{font:500 15px var(--display)}
tr.lock td{color:var(--muted)}
.lk{font:400 12px var(--body);color:var(--muted);margin-left:4px}
tr.now td{background:var(--good-soft)}
.pill{display:inline-block;font:500 12px var(--body);padding:1px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap;margin:1px 2px 1px 0}
.pill.night{background:var(--moon-soft);border-color:transparent;color:var(--moon)}
.pill.leg{background:var(--ember-soft);border-color:transparent;color:var(--ember)}
details.xp{margin-top:14px}
details.xp summary{cursor:pointer;font:500 15px var(--display)}
.dishes{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.dish{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.dish .buff{margin-top:6px;padding:6px 10px;border-radius:9px;background:var(--moon-soft);font-size:14px}
.dish ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.note{font-size:13px;color:var(--muted);margin-top:14px}
@keyframes hitfade{0%{box-shadow:inset 0 0 0 3px var(--ember)}100%{box-shadow:inset 0 0 0 3px transparent}}
.hit,.hit td{animation:hitfade 2.4s ease-out 1}
@media (max-width:700px){.rail{position:static}.skills{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.skills button{flex:0 0 auto}}
</style>

// อาชีพเสริม page: D = life.json (static read of life*.js, cooking.js, brew.js). One skill at a time.
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const n0 = (x) => Number(x || 0).toLocaleString();
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
$('#buildTag').textContent = 'build ' + D.build;
const TABS = [['wood', 'ตัดไม้', 'ไม้'], ['mine', 'ขุดแร่', 'แร่'], ['farm', 'ปลูกผัก', 'ผัก'], ['fish', 'ตกปลา', 'ปลา'], ['cook', 'ทำอาหาร', 'ครัว'], ['brew', 'ต้มยา', 'ยา']];
const ME = (() => { try { return JSON.parse(store.get('nc_life') || '{}'); } catch (e) { return {}; } })();
let tab = ME.tab && TABS.some((t) => t[0] === ME.tab) ? ME.tab : 'wood';
const my = (k) => ME[k] || (ME[k] = { lv: 1, tier: 1 });
const save = () => store.set('nc_life', JSON.stringify(ME));
const XPN = Object.fromEntries(D.xpTable); // Lv → XP to Lv+1
const toMax = (lv) => D.xpTable.filter(([l]) => l >= lv).reduce((a, [, x]) => a + x, 0);
const rank = (lv) => D.ranks.filter(([l]) => lv >= l).pop()[1];
const pill = (t, c) => `<span class="pill ${c || ''}">${esc(t)}</span>`;
const where = (L, max = 3) => (L || []).length ? (L.slice(0, max).map((x) => pill(x)).join('') + (L.length > max ? `<span class="muted"> +${L.length - max}</span>` : '')) : '<span class="muted">—</span>';

$('#skills').innerHTML = TABS.map(([k, n, i]) => `<button data-k="${k}" aria-pressed="${k === tab}" style="--k:var(--k-${k})"><i>${i}</i>${n}</button>`).join('');
$('#skills').addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) go(b.dataset.k); });
function go(k) { tab = k; ME.tab = k; save(); for (const b of document.querySelectorAll('#skills button')) b.setAttribute('aria-pressed', b.dataset.k === k); render(); }

// ---------- the shared parts of a life skill ----------
function heroCard(S, k) {
  const rules = S.rules || [], first = rules.slice(0, 4), rest = rules.slice(4);
  return `<section class="card hero" style="--k:var(--k-${k})"><h2>${esc(S.name)}</h2>
    <div class="facts"><span class="fact">ครู <b>${esc(S.teacher)}</b></span><span class="fact">${esc(S.title || '')}</span><span class="fact">Lv สูงสุด <b>${D.maxLv}</b></span></div>
    <p class="muted" style="font-size:13.5px">${esc(S.where || '')}</p>
    <ul class="rules">${first.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>
    ${rest.length ? `<details style="margin-top:6px"><summary class="muted" style="cursor:pointer">กติกาทั้งหมด (${rules.length})</summary><ul class="rules">${rest.map((r) => `<li>${esc(r)}</li>`).join('')}</ul></details>` : ''}</section>`;
}
// what to do at my level: the best node (most XP) I can work now, and how many to the next level
function meCard(S, k, best) {
  const m = my(k), lv = Math.max(1, Math.min(D.maxLv, m.lv)), need = XPN[lv], left = toMax(lv);
  const pct = Math.round(((D.xpCumulativeTo30 - left) / D.xpCumulativeTo30) * 100);
  return `<section class="card" style="--k:var(--k-${k})"><h3>เลเวลของฉัน</h3>
    <div class="me"><label>${esc(S.name)} Lv <input type="number" min="1" max="${D.maxLv}" value="${lv}" data-me="lv" aria-label="เลเวล${esc(S.name)}"></label>
      <label>${esc(S.toolNames ? 'เครื่องมือ' : '')} <select data-me="tier" aria-label="ขั้นเครื่องมือ" style="font:15px var(--body);min-height:42px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:6px 8px">${(S.tools || []).map((t) => `<option value="${t.tier}"${t.tier === m.tier ? ' selected' : ''}>ขั้น ${t.tier} · ${esc(t.name)}</option>`).join('')}</select></label></div>
    <div class="stats"><div class="stat"><small>ระดับ</small><b style="font-family:var(--display);font-weight:500">${esc(rank(lv))}</b></div>
      <div class="stat"><small>XP ไป Lv ${Math.min(lv + 1, D.maxLv)}</small><b>${lv >= D.maxLv ? '—' : n0(need)}</b></div>
      <div class="stat"><small>XP ที่เหลือถึง Lv ${D.maxLv}</small><b>${n0(left)}</b></div></div>
    <div class="bar" title="${pct}% ของทาง Lv 1 → ${D.maxLv}"><i style="width:${pct}%"></i></div>
    ${best ? `<div class="best">${best}</div>` : ''}</section>`;
}
function toolLadder(S, k) {
  const m = my(k);
  return `<div class="shead"><h2>${esc(S.toolNames ? 'เครื่องมือ 4 ขั้น' : '')}</h2><span class="muted" style="font-size:13.5px">อัปเกรดที่ ${esc(S.teacher)}</span></div>
  <div class="ladder" style="--k:var(--k-${k})">${(S.tools || []).map((t) => `<div class="tier${t.tier === m.tier ? ' have' : ''}"><span class="tn">ขั้น ${t.tier}${t.tier === m.tier ? ' · ที่ใช้อยู่' : ''}</span><b>${esc(t.name)}</b>
    <small>${t.starter ? 'มีตั้งแต่เริ่ม' : `ต้อง Lv ${t.needLv} · ${n0(t.coins)} เหรียญ`}</small>${(t.mats || []).length ? `<small>${t.mats.map(([n, q]) => `${esc(n)} ×${q}`).join(' · ')}</small>` : ''}
    <small style="color:var(--fg);margin-top:4px">${esc(t.effect || '')}</small></div>`).join('')}</div>`;
}
function perks(S, k) {
  const lv = my(k).lv, mech = Object.fromEntries(S.perkMechanics || []);
  return `<section class="card"><h3>ความสามารถที่ปลดทุก 5 เลเวล</h3><div class="perks">${(S.perks || []).map(([l, t]) => `<div class="perk ${lv >= l ? 'on' : 'off'}"><span class="lv">${lv >= l ? '✓' : ''} Lv ${l}</span><span>${esc(t)}${mech[l] && mech[l] !== t ? ` <span class="muted" style="font-size:13px">(${esc(mech[l])})</span>` : ''}</span></div>`).join('')}</div></section>`;
}
const gives = (G) => (G || []).map(([n, q]) => `<div><b style="font-weight:500">${esc(n)}</b> <span class="muted" style="font-size:13px">${esc(q)}</span></div>`).join('');

// ---------- woodcutting / mining: the nodes ----------
function nodeSkill(k) {
  const S = D.skills[k], m = my(k), nodes = S.nodes.slice().sort((a, b) => a.lv - b.lv || a.tier - b.tier);
  const ok = (x) => x.lv <= m.lv && x.tier <= m.tier;
  const best = nodes.filter(ok).sort((a, b) => b.xp - a.xp)[0];
  const bestTxt = best && m.lv < D.maxLv ? `<b>${k === 'wood' ? 'ต้นที่คุ้มสุดตอนนี้' : 'สายแร่ที่คุ้มสุดตอนนี้'}: ${esc(best.name)}</b> · ${best.xp} XP ต่อ${k === 'wood' ? 'ต้น' : 'สาย'} · อีกราว <b>${Math.ceil(XPN[m.lv] / best.xp)}</b> ${k === 'wood' ? 'ต้น' : 'สาย'} ถึง Lv ${m.lv + 1}<div class="muted" style="font-size:13px;margin-top:2px">ที่ ${esc((best.where || []).slice(0, 3).join(' · '))}</div>` : '';
  const row = (x) => `<tr class="${ok(x) ? (best && x.id === best.id ? 'now' : '') : 'lock'}" data-name="${esc(x.name)}"><td class="nm">${esc(x.name)}${x.night ? ' ' + pill('กลางคืน', 'night') : ''}${ok(x) ? '' : '<span class="lk">ยังไม่ถึง</span>'}</td><td class="num">${x.lv}</td><td class="num">${x.tier}</td><td class="num">${x.hp}</td><td class="num">${x.xp}</td><td>${gives(x.gives)}</td><td>${where(x.where, 4)}</td></tr>`;
  let extra = '';
  if ((S.extras || []).length) extra += `<div class="shead"><h2>ของแถมและของหายาก</h2></div><div class="tw"><table><thead><tr><th>ของ</th><th>ได้จาก</th><th class="num">โอกาส</th><th>ที่ไหน</th></tr></thead><tbody>${S.extras.map((x) => `<tr><td class="nm">${esc(x.item || x.name || '')}</td><td>${esc(x.treeNote || x.from || x.notes || '')}</td><td class="num">${typeof x.chance === 'number' ? +(x.chance * 100).toFixed(2) + '%' + (x.chanceLv20 ? ` → ${+(x.chanceLv20 * 100).toFixed(2)}% (Lv 20)` : '') : esc(x.chance || '')}</td><td>${where(x.where, 3)}</td></tr>`).join('')}</tbody></table></div>`;
  if ((S.fieldVeins || []).length) {
    const by = {}; for (const v of S.fieldVeins) ((by[v.map] = by[v.map] || {})[v.ore] = (by[v.map][v.ore] || 0) + 1);
    extra += `<div class="shead"><h2>สายแร่นอกดันเจี้ยน</h2><span class="muted" style="font-size:13.5px">จุดตายตัวในแมพทุ่ง</span></div><div class="tw"><table><thead><tr><th>แมพ</th><th>สายแร่</th></tr></thead><tbody>${Object.entries(by).map(([mp, o]) => `<tr><td class="nm">${esc(mp)}</td><td>${Object.entries(o).map(([n, c]) => pill(`${n} ×${c}`)).join('')}</td></tr>`).join('')}</tbody></table></div>`;
  }
  return `<div class="grid">${heroCard(S, k)}${meCard(S, k, bestTxt)}</div>${toolLadder(S, k)}
    <div class="shead"><h2>${k === 'wood' ? 'ต้นไม้ที่ตัดได้' : 'สายแร่ที่ขุดได้'}</h2><span class="muted" style="font-size:13.5px">แถวเขียว = คุ้มสุดสำหรับคุณ · แถวจาง = เลเวลหรือเครื่องมือยังไม่ถึง</span></div>
    <div class="tw"><table><thead><tr><th>ชื่อ</th><th class="num">Lv</th><th class="num">เครื่องมือขั้น</th><th class="num">ตีกี่ครั้ง</th><th class="num">XP</th><th>ได้</th><th>ที่ไหน</th></tr></thead><tbody>${nodes.map(row).join('')}</tbody></table></div>
    ${extra}<div class="sec">${perks(S, k)}</div>`;
}

// ---------- fishing ----------
let water = '';
function fishSkill() {
  const S = D.skills.fish, F = D.fish, m = my('fish'), W = Object.fromEntries(F.waters.map((w) => [w.id, w]));
  const ok = (x) => x.lv <= m.lv && x.rodTier <= m.tier;
  const list = F.fish.filter((x) => !water || x.waters.includes(water)).sort((a, b) => a.lv - b.lv || a.price - b.price);
  const best = F.fish.filter((x) => ok(x) && !x.legendary).sort((a, b) => b.xp - a.xp)[0];
  const bestTxt = best && m.lv < D.maxLv ? `<b>ปลาที่ให้ XP สูงสุดที่ตกได้ตอนนี้: ${esc(best.name)}</b> · ${best.xp} XP · ขาย ${n0(best.price)}<div class="muted" style="font-size:13px;margin-top:2px">${esc(best.waters.map((w) => (W[w] || {}).name || w).join(' · '))} · ${esc(best.time)}</div>` : '';
  const row = (x) => `<tr class="${ok(x) ? '' : 'lock'}" data-name="${esc(x.name)}"><td class="nm">${esc(x.name)}${ok(x) ? '' : '<span class="lk">ยังไม่ถึง</span>'}${x.legendary ? ' ' + pill('ตำนาน', 'leg') : ''}${x.night ? ' ' + pill('กลางคืน', 'night') : x.day ? ' ' + pill('กลางวัน') : ''}</td><td class="num">${x.lv}</td><td class="num">${x.rodTier}</td>
    <td>${x.waters.map((w) => pill((W[w] || {}).name || w)).join('')}</td><td class="num">${x.sizeCm ? x.sizeCm.join('–') + ' ซม.' : '—'}</td><td class="num">${x.xp}</td><td class="num">${n0(x.price)}</td><td>${esc(x.rarity || '')}</td></tr>`;
  return `<div class="grid">${heroCard(S, 'fish')}${meCard(S, 'fish', bestTxt)}</div>${toolLadder(S, 'fish')}
    <div class="shead"><h2>แหล่งน้ำ</h2></div><div class="tw"><table><thead><tr><th>แหล่งน้ำ</th><th>แมพ</th><th>ปลาที่มี</th></tr></thead><tbody>${F.waters.map((w) => `<tr><td class="nm">${esc(w.name)}</td><td>${where(w.maps, 4)}</td><td style="font-size:13.5px">${esc((w.fish || []).join(' · '))}</td></tr>`).join('')}</tbody></table></div>
    <div class="shead"><h2>ปลาทั้งหมด (${F.fish.length})</h2><label class="muted" style="font-size:14px">แหล่งน้ำ <select id="water" style="font:15px var(--body);min-height:40px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:6px 8px"><option value="">ทุกแหล่ง</option>${F.waters.map((w) => `<option value="${w.id}"${w.id === water ? ' selected' : ''}>${esc(w.name)}</option>`).join('')}</select></label></div>
    <div class="tw"><table><thead><tr><th>ปลา</th><th class="num">Lv</th><th class="num">คันขั้น</th><th>แหล่งน้ำ</th><th class="num">ขนาด</th><th class="num">XP</th><th class="num">ขายได้</th><th>ความหายาก</th></tr></thead><tbody>${list.map(row).join('')}</tbody></table></div>
    <p class="note">ของที่ไม่ใช่ปลา: ${F.junk.map((j) => `${esc(j.name)} (ขาย ${n0(j.price)})`).join(' · ')}</p>
    <div class="sec">${perks(S, 'fish')}</div>`;
}

// ---------- farming ----------
function farmSkill() {
  const S = D.skills.farm, F = D.farm, m = my('farm');
  const crops = F.crops.slice().sort((a, b) => a.lv - b.lv);
  const ok = (x) => x.lv <= m.lv;
  const best = crops.filter(ok).sort((a, b) => b.xp / b.minsTotal - a.xp / a.minsTotal)[0];
  const bestTxt = best && m.lv < D.maxLv ? `<b>ผักที่ได้ XP ต่อเวลาคุ้มสุด: ${esc(best.name)}</b> · ${best.xp} XP ต่อแปลงทุก ${esc(best.growTime)} · ปลูกเต็ม ${F.plots.start} แปลงได้ ${n0(best.xp * F.plots.start)} XP ต่อรอบ` : '';
  return `<div class="grid">${heroCard(S, 'farm')}${meCard(S, 'farm', bestTxt)}</div>${toolLadder(S, 'farm')}
    <div class="shead"><h2>ผักที่ปลูกได้</h2><span class="muted" style="font-size:13.5px">โตตามเวลาจริง แม้ปิดเกม · 3 ช่วง รดน้ำทุกช่วงได้ดาวครบ</span></div>
    <div class="tw"><table><thead><tr><th>ผัก</th><th class="num">Lv</th><th>เมล็ด</th><th class="num">ราคาเมล็ด</th><th class="num">เวลาโต</th><th class="num">XP</th><th class="num">ขายได้</th><th>หมายเหตุ</th></tr></thead><tbody>${crops.map((x) => `<tr class="${ok(x) ? (best && x.id === best.id ? 'now' : '') : 'lock'}" data-name="${esc(x.name)}"><td class="nm">${esc(x.name)}${x.nightOnly ? ' ' + pill('เก็บกลางคืน', 'night') : ''}${ok(x) ? '' : '<span class="lk">ยังไม่ถึง</span>'}</td><td class="num">${x.lv}</td><td>${esc(x.seed)}</td><td class="num">${n0(x.seedPrice)}</td><td class="num">${esc(x.growTime)}</td><td class="num">${x.xp}</td><td class="num">${n0(x.sellPrice)}</td><td style="font-size:13px">${x.seedFromMonster ? `เมล็ดดรอปจาก ${esc(x.seedFromMonster.monster)} ${+(x.seedFromMonster.chance * 100).toFixed(2)}%` : ''}${x.seedReturnChance ? ` · ได้เมล็ดคืน ${Math.round(x.seedReturnChance * 100)}%` : ''}</td></tr>`).join('')}</tbody></table></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))">
      <section class="card"><h3>แปลงผัก</h3><p style="margin:0">เริ่ม ${F.plots.start} แปลง สูงสุด ${F.plots.max} (${esc(F.plots.layout)}) · ${esc(F.plots.map)}</p>
        <div class="tw" style="margin-top:8px"><table><thead><tr><th>เปิดเป็น</th><th class="num">ต้อง Lv</th><th class="num">ราคา</th></tr></thead><tbody>${F.plots.openCosts.map((o) => `<tr><td>${o.plots} แปลง</td><td class="num">${o.needLv}</td><td class="num">${n0(o.coins)}</td></tr>`).join('')}</tbody></table></div></section>
      <section class="card"><h3>ปุ๋ยและอีกา</h3><ul class="rules" style="margin-top:0">${F.fertiliser.map((f) => `<li><b style="font-weight:500">${esc(f.name)}</b>: ${esc(f.effect)} · ${esc(f.note || '')}</li>`).join('')}<li>${esc(F.crowsScarecrow)}</li>
        <li>XP ระหว่างทาง: พรวนดิน ${F.xpActions.till} · ปลูก ${F.xpActions.plant} · รดน้ำ ${F.xpActions.water} · ไล่อีกา ${F.xpActions.shoo}</li></ul></section></div>
    <div class="sec">${perks(S, 'farm')}</div>`;
}

// ---------- cooking ----------
const BUFF = { atk: 'ATK', matk: 'MATK', taken: 'ดาเมจที่รับ', hpReg: 'ฟื้น HP', spReg: 'ฟื้น SP', spd: 'วิ่งเร็ว' };
function cookSkill() {
  const S = D.skills.cook, C = D.cook, m = my('cook');
  const ok = (x) => x.lv <= m.lv && x.pot <= m.tier;
  const dishes = C.dishes.slice().sort((a, b) => a.lv - b.lv);
  const best = dishes.filter(ok).sort((a, b) => b.xp - a.xp)[0];
  const bestTxt = best && m.lv < D.maxLv ? `<b>เมนูที่ได้ XP สูงสุดตอนนี้: ${esc(best.name)}</b> · ${best.xp} XP ต่อจาน · อีกราว <b>${Math.ceil(XPN[m.lv] / best.xp)}</b> จาน ถึง Lv ${m.lv + 1}` : '';
  return `<div class="grid">${heroCard(S, 'cook')}${meCard(S, 'cook', bestTxt)}</div>${toolLadder(S, 'cook')}
    <div class="shead"><h2>สูตรอาหาร (${dishes.length})</h2><span class="muted" style="font-size:13.5px">กินได้ทีละ 1 จาน บัฟอยู่ 30 นาที (ทำอาหาร Lv 10: 33 · Lv 25: 36) · กินจานใหม่แทนจานเดิม</span></div>
    <div class="dishes">${dishes.map((x) => `<div class="dish${ok(x) ? '' : ' muted'}" data-name="${esc(x.name)}" style="${ok(x) ? '' : 'opacity:.6'}"><h3 style="margin:0">${esc(x.name)}</h3>
      <div class="facts" style="margin-top:6px"><span class="fact">Lv <b>${x.lv}</b></span><span class="fact">${esc(x.potName)} (ขั้น ${x.pot})</span><span class="fact">${n0(x.coins)} เหรียญ</span><span class="fact">${x.xp} XP</span></div>
      <div class="buff">${esc(x.buffText)}</div><ul>${x.ingredients.map(([n, q]) => `<li>${esc(n)} ×${q}</li>`).join('')}</ul>${x.desc ? `<p class="muted" style="font-size:13px;margin:6px 0 0">${esc(x.desc)}</p>` : ''}</div>`).join('')}</div>
    <div class="sec">${perks(S, 'cook')}</div>`;
}

// ---------- brewing (Uncle Coco's shop) ----------
function brewTab() {
  const B = D.brew;
  return `<section class="card hero" style="--k:var(--k-brew);margin-top:14px"><h2>ต้มยาที่ลุงโกโก้</h2><ul class="rules">${B.rules.map((r) => `<li>${esc(r)}</li>`).join('')}</ul></section>
    <div class="shead"><h2>สูตรต้มยา (ต่อ 10 ขวด)</h2><span class="muted" style="font-size:13.5px">ใช้ของขยะจากมอนที่ราคาถูกสุดก่อน</span></div>
    <div class="tw"><table><thead><tr><th>ยา</th><th>ชนิด</th><th class="num">ฟื้น</th><th class="num">ราคาร้าน 10 ขวด</th><th class="num">ขยะที่ใช้</th><th class="num">เหรียญที่ใช้</th><th class="num">ประหยัด</th></tr></thead><tbody>${B.recipes.map((r) => `<tr data-name="${esc(r.potion)}"><td class="nm">${esc(r.potion)}</td><td>${esc(r.color)}</td><td class="num">${r.heal}</td><td class="num">${n0(r.shopPrice * 10)}</td><td class="num">${r.junkPiecesPer10} ชิ้น</td><td class="num">${n0(r.coinsPer10)}</td><td class="num good">${n0(r.shopPrice * 10 - r.coinsPer10)}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">ประหยัด = ราคาร้านลบเหรียญที่ใช้ ยังไม่หักมูลค่าของขยะที่ขายได้ ของขยะเลเวลสูงบางชิ้นขายแพงกว่า ต้มแล้วอาจไม่คุ้ม</p>`;
}

function xpTable() {
  return `<details class="xp card"><summary>ตาราง XP ต่อเลเวล (ใช้เหมือนกันทุกอาชีพเสริม)</summary><div class="tw" style="margin-top:10px"><table><thead><tr><th class="num">Lv</th><th class="num">XP ไปเลเวลถัดไป</th><th class="num">สะสมถึง Lv ${D.maxLv}</th></tr></thead><tbody>${D.xpTable.map(([l, x]) => `<tr><td class="num">${l} → ${l + 1}</td><td class="num">${n0(x)}</td><td class="num">${n0(toMax(l))}</td></tr>`).join('')}</tbody></table></div>
    <p class="note" style="margin-top:8px">สูตร: 12 × Lv^1.8 (ปัดเศษ) · รวม Lv 1 → ${D.maxLv} = ${n0(D.xpCumulativeTo30)} XP</p></details>`;
}

function render() {
  $('#main').innerHTML = (tab === 'wood' || tab === 'mine' ? nodeSkill(tab) : tab === 'fish' ? fishSkill() : tab === 'farm' ? farmSkill() : tab === 'cook' ? cookSkill() : brewTab()) + (tab !== 'brew' ? xpTable() : '');
}
$('#main').addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.me) { const m = my(tab); m[t.dataset.me] = Math.max(1, Math.min(t.dataset.me === 'lv' ? D.maxLv : 4, +t.value || 1)); save(); render(); }
  if (t.id === 'water') { water = t.value; render(); }
});
// opened from the site search: the skill, then the row
window.addEventListener('message', (e) => {
  if (e.source !== window.parent || (e.origin !== location.origin && e.origin !== 'null')) return;
  const d = e.data || {}; if (d.nc !== 'find' || !d.skill) return;
  if (d.skill !== tab) go(d.skill);
  if (d.skill === 'fish' && water) { water = ''; render(); }
  const names = [].concat(d.text || []).filter(Boolean);
  const el = [...document.querySelectorAll('[data-name]')].find((x) => names.includes(x.dataset.name));
  if (el) { el.scrollIntoView({ block: 'center' }); el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }
  else window.scrollTo(0, 0);
});
render();

</script>
<script>/* English mode: when the viewer picked EN (localStorage nc_lang), swap the Thai interface text for English as the page
   renders. Game names that have no official English (items, monsters) stay Thai. */
(function () {
  var lang = 'th';
  try { lang = localStorage.getItem('nc_lang') || 'th'; } catch (e) {}
  if (lang !== 'en') return;
  // the dictionary is its own file (i18n.js sets window.NC_I18N), fetched only for English viewers
  if (window.NC_I18N) return start(window.NC_I18N);
  var sc = document.createElement('script');
  sc.src = 'i18n.js?v=a4ad00a9'; sc.onload = function () { if (window.NC_I18N) start(window.NC_I18N); };
  document.head.appendChild(sc);
