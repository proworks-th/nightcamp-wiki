<html lang="th">
<head><style>button,input,select,textarea{font-family:inherit}</style><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://xjimxvllspnzutidlvwl.supabase.co; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta charset="utf-8">

<title>NightCamp รูนจารึกสกิล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* รูนจารึกสกิล: every rune as a card (filter by the kind of skill it fits, tier I-III), and the runes for my job */
:root{
  --bg:#eef0f6; --panel:#ffffff; --panel2:#e3e7f1; --line:#c9cfdf; --fg:#18203a; --muted:#56607c;
  --ember:#c4561a; --moon:#3c4fa8; --rune:#6a4fc8; --rune-soft:#ece6ff;
  --display:'Mitr','Noto Sans Thai',system-ui,sans-serif; --body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --k-proj:#2f7fc4; --k-area:#2f9e6c; --k-melee:#c4561a; --k-attack:#b33a3a; --k-buff:#c79a17; --k-pet:#8a4fd0; --k-any:#6b7390;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10132a; --panel:#181c38; --panel2:#20254a; --line:#2f3563; --fg:#e9ebf7; --muted:#a3a9cc;
  --ember:#f59a4c; --moon:#aab8ff; --rune:#b49cff; --rune-soft:#2a2550;
  --k-proj:#7fc0ff; --k-area:#5ad19a; --k-melee:#f59a4c; --k-attack:#ff8a8a; --k-buff:#f2cc4d; --k-pet:#c9a2ff; --k-any:#a3a9cc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10132a; --panel:#181c38; --panel2:#20254a; --line:#2f3563; --fg:#e9ebf7; --muted:#a3a9cc;
  --ember:#f59a4c; --moon:#aab8ff; --rune:#b49cff; --rune-soft:#2a2550;
  --k-proj:#7fc0ff; --k-area:#5ad19a; --k-melee:#f59a4c; --k-attack:#ff8a8a; --k-buff:#f2cc4d; --k-pet:#c9a2ff; --k-any:#a3a9cc; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 40px}
header.top{padding-block:18px 6px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0}
h1 span{color:var(--rune)}
h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0 0 8px}
.lead{margin:6px 0 0;max-width:820px}
.muted{color:var(--muted)}
a{color:var(--moon)}
.how{margin:12px 0 14px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:14px}
.how b{font-family:var(--display);font-weight:500}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:4px 0 12px}
.seg button{font:500 15px var(--display);border:0;background:none;color:var(--muted);padding:8px 14px;border-radius:9px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--rune);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 14px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{border-color:var(--rune);background:var(--rune-soft);color:var(--rune);font-weight:600}
input[type=search],select{font:15px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-height:40px}
input[type=search]{min-width:0;width:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card h3{font:500 17px var(--display);margin:0;display:flex;align-items:center;gap:8px}
.k{display:inline-block;font:500 12px var(--body);padding:1px 9px;border-radius:999px;color:var(--kc);border:1px solid color-mix(in srgb,var(--kc) 50%,transparent);background:color-mix(in srgb,var(--kc) 12%,transparent);white-space:nowrap}
.fx{font-size:15px;margin:0}
.tiers{margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.tiers li b{font-family:var(--mono);font-weight:500;color:var(--fg);margin-right:4px}
.tiers li.on{color:var(--fg)}
.foot{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin-top:auto;padding-top:4px;border-top:1px dashed var(--line)}
.rsrc{font-size:12.5px;color:var(--muted);flex:1 1 14em;min-width:0;overflow-wrap:anywhere;white-space:normal}
.empty{padding:24px;text-align:center;color:var(--muted)}
/* my job */
.legend{display:grid;gap:6px;margin-bottom:12px}
.legend div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.rl a{white-space:nowrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
thead th{font:600 12px var(--mono);color:var(--muted);background:var(--panel2);white-space:nowrap}
td.sl{font-family:var(--mono);white-space:nowrap}
td.nm{white-space:nowrap}
.jh{font:500 15px var(--display);background:var(--panel2)}
/* farm a rune */
.fbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-bottom:10px}
.fbar label,.fbar .fl{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.fbar input[type=number]{font:15px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-height:40px;width:84px}
.fbar .lvr{display:flex;gap:6px;align-items:center}
.fsum{margin:4px 0 12px;padding:10px 14px;border:1px solid var(--line);border-left:3px solid var(--rune);border-radius:12px;background:var(--panel);font-size:14px}
.fsum b{font-family:var(--mono);font-weight:500}
td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
td.mp{min-width:9em}
.tg{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-left:4px;color:var(--muted);white-space:nowrap}
.share{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--panel2);vertical-align:middle;margin-right:6px;overflow:hidden}
.share i{display:block;height:100%;background:var(--rune)}
.more{margin-top:10px}
.more button,.foot button{font:500 14px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--moon);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:36px}
.note{margin-top:12px;font-size:13px;color:var(--muted)}
.sub{display:none;font-size:12.5px;color:var(--muted);margin-top:2px}
.sub a{display:inline-block;min-height:24px;line-height:24px}
@media (max-width:640px){.mons,.kc,.share{display:none}.sub{display:block}td.mp{min-width:0}}
.note li{margin:2px 0}
@media (max-width:640px){input[type=search]{width:100%}.bar label{width:100%}th,td{padding:7px 8px}td.nm{white-space:normal}}
</style>
<style>/* shared by every page (site.py puts it in each head): where a number comes from, and "how to read this" */
.src{display:inline-block;font:600 11px/1.6 var(--body,system-ui);padding:0 7px;border-radius:999px;vertical-align:middle;white-space:nowrap;letter-spacing:.2px}
.src.game{background:color-mix(in srgb,var(--moon,#3c4fa8) 14%,transparent);color:var(--moon,#3c4fa8)}
.src.est{background:color-mix(in srgb,var(--ember,#c4561a) 16%,transparent);color:var(--ember,#c4561a)}
details.howto{margin:10px 0;border:1px solid var(--line,#c9cfdf);border-radius:12px;background:var(--panel,#fff);font-size:14px}
details.howto>summary{cursor:pointer;padding:8px 12px;font-weight:600;list-style:none}
details.howto>summary::-webkit-details-marker{display:none}
details.howto>summary::before{content:"ⓘ ";color:var(--moon,#3c4fa8)}
details.howto>ul{margin:0;padding:0 14px 6px 30px}
details.howto li{margin:4px 0}
details.howto>p{margin:0;padding:4px 12px 10px;color:var(--muted,#56607c);font-size:13px}
.wk{white-space:nowrap}
</style><style>/* touch screens: every control at least 44 x 44 CSS px (Apple / Android guidance), links in lists and tables at least
   24 px tall (WCAG 2.2 target size). Only on touch (pointer: coarse); the desktop look is unchanged. Loaded after each
   page's own style, so it wins; !important only on the sizes, because some widgets add their style later. */
@media (pointer: coarse) {
  button, select, summary, [role=button], .btn, .chip, a.btn,
  input:not([type=checkbox]):not([type=radio]):not([type=hidden]):not([type=range]) { min-height: 44px !important; }
  button, [role=button], .btn, .chip, a.btn, select { min-width: 44px !important; }
  summary { display: list-item; padding-block: 10px; box-sizing: border-box; }
  label:has(> input[type=checkbox]), label:has(> input[type=radio]) { display: inline-flex; align-items: center; gap: 8px; min-height: 44px !important; }
  a.brand, #brand, .ddm a, [role=menuitem] { display: inline-flex; align-items: center; min-height: 44px !important; }
  .ddm a, [role=menuitem] { display: flex; }
  /* plain links: 4 px above and below (an inline link's padding grows its tap area without moving the text); :where()
     keeps this weaker than any padding a page sets itself */
  :where(a[href]:not(.btn):not(.chip)) { padding-block: 4px; }
  a.kt { padding-block: 4px; }   /* the skill-kind tags on the wiki (links drawn as small tags) */
}
</style></head>
<body>
<div class="wrap">
  <header class="top">
    <h1>รูนจารึกสกิล</h1>
    <p class="lead muted" id="lead"></p>
  </header>
  <div class="how" id="how"></div>
  <div class="seg" role="group" aria-label="มุมมอง"><button id="vAll" aria-pressed="true">รูนทั้งหมด</button><button id="vMine" aria-pressed="false">รูนสำหรับอาชีพฉัน</button><button id="vFarm" aria-pressed="false">ฟาร์มรูน</button></div>

  <section id="all">
    <div class="bar">
      <div class="chips" id="kinds" role="group" aria-label="ชนิดสกิล"></div>
      <div class="chips" id="tiers" role="group" aria-label="ขั้น"></div>
      <label><input type="search" id="q" placeholder="ค้นชื่อหรือผล เช่น ดาเมจ, มึน" aria-label="ค้นรูน"></label>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="mine" hidden>
    <div class="bar"><label>อาชีพ <select id="job" aria-label="อาชีพ"></select></label><span class="muted" id="jobNote"></span></div>
    <div class="legend" id="legend"></div>
    <div class="tw"><table><thead><tr><th>สกิล</th><th>ช่องรูนเปิดที่</th><th>ชนิด</th><th>รูนเฉพาะชนิดนี้</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>

  <section id="farm" hidden>
    <div class="fbar">
      <label>รูน <select id="fRune" aria-label="รูน"></select></label>
      <div class="fl"><span>ขั้น</span><span class="chips" id="fTier" role="group" aria-label="ขั้น"></span></div>
      <label>จำนวน <input type="number" id="fQty" min="1" max="20" value="1" aria-label="จำนวน"></label>
      <label>เลเวลแมพ <span class="lvr"><input type="number" id="fLo" min="1" max="99" value="1" aria-label="เลเวลต่ำสุด"><span>–</span><input type="number" id="fHi" min="1" max="99" value="99" aria-label="เลเวลสูงสุด"></span></label>
      <label>ฆ่าได้ (ตัว/นาที) <input type="number" id="fKpm" min="1" max="120" value="10" aria-label="ฆ่าได้ ตัวต่อนาที"></label>
      <div class="fl"><span>ความมั่นใจ</span><span class="chips" id="fConf" role="group" aria-label="ความมั่นใจ"></span></div>
    </div>
    <div class="fsum" id="fSum"></div>
    <div class="tw"><table><thead id="fHead"></thead><tbody id="fRows"></tbody></table></div>
    <div class="more" id="fMore"></div>
    <ul class="note" id="fNote"></ul>
  </section>
</div>

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const ROM = ['', 'I', 'II', 'III'], KORDER = ['proj', 'area', 'melee', 'attack', 'buff', 'pet', 'any'];
const kname = (on) => D.on[on];
const ktag = (on) => `<span class="k" style="--kc:var(--k-${on})">${esc(on === 'any' ? 'ทุกสกิล' : D.on[on].startsWith('สกิล') ? D.on[on] : 'สกิล' + D.on[on])}</span>`;
const wl = (path, label) => path ? `<a href="${esc(path)}" target="_top">${esc(label)}</a>` : esc(label);
// (a rune's page and a skill's page: the wiki, opened over the site)

$('#lead').textContent = `รูน ${Object.keys(D.runes).length} แบบ ใส่ในช่องรูนของสกิล ไม่ได้ใส่ในอุปกรณ์ (ไฟล์เกมรุ่น ${D.build})`;
$('#how').innerHTML = `<b>ใส่ยังไง</b> ${esc(D.inGame.note)}<br><b>ได้จากไหน</b> ${esc(D.inGame.src)} (ข้อความในเกม)<br><b>ขั้น II และ III</b> รวมรูนขั้นก่อนหน้า 3 อันที่ป๋าหมูหริ่ง`;

// ---------- every rune ----------
const F = { kind: '', tier: 1, q: '' };
try { Object.assign(F, JSON.parse(store.get('nc_rune_f') || '{}')); } catch (e) {}
function chips() {
  $('#kinds').innerHTML = [['', 'ทุกชนิด']].concat(KORDER.map((k) => [k, k === 'any' ? 'ใส่ได้ทุกสกิล' : kname(k)])).map(([k, n]) => `<button class="chip" data-kind="${k}" aria-pressed="${F.kind === k}">${esc(n)}</button>`).join('');
  $('#tiers').innerHTML = [1, 2, 3].map((t) => `<button class="chip" data-tier="${t}" aria-pressed="${F.tier === t}">ขั้น ${ROM[t]}</button>`).join('');
}
function src(k) {
  if (k === 'heavy') return 'บอสแมพดรอป';
  if (k === 'blood') return 'บอสเนื้อเรื่องดรอป';
  return 'มอนสายที่ตรงกันดรอป' + (k === 'moonrite' ? ' · เควสสอนเล่นให้ 3 อัน' : '');
}
function renderAll() {
  chips();
  const q = F.q.trim().toLowerCase();
  const list = Object.entries(D.runes).filter(([k, r]) => (!F.kind || r.on === F.kind) && (!q || (r.n + ' ' + r.t.join(' ')).toLowerCase().includes(q)))
    .sort((a, b) => KORDER.indexOf(a[1].on) - KORDER.indexOf(b[1].on));
  $('#grid').innerHTML = list.length ? list.map(([k, r]) => `<article class="card"><h3>${esc(r.n)} ${ROM[F.tier]}</h3>
    <div>${ktag(r.on)}</div>
    <p class="fx">${esc(r.t[F.tier - 1])}</p>
    <ul class="tiers">${[1, 2, 3].map((t) => `<li class="${t === F.tier ? 'on' : ''}"><b>${ROM[t]}</b>${esc(r.t[t - 1])}</li>`).join('')}</ul>
    <div class="foot"><span>ใส่ได้ ${D.count[k]} สกิล</span><span class="rsrc">${esc(src(k))}</span><button data-farm="${k}">ฟาร์มที่ไหน</button>${D.w[k] ? `<a href="${esc(D.w[k])}" target="_top">หน้าวิกิ ↗</a>` : ''}</div></article>`).join('')
    : '<div class="empty">ไม่เจอรูนที่ตรงกับตัวกรอง</div>';
  store.set('nc_rune_f', JSON.stringify(F));
}
$('#kinds').addEventListener('click', (e) => { const b = e.target.closest('[data-kind]'); if (b) { F.kind = b.dataset.kind; renderAll(); } });

    var sep = c.indexOf(' · ') >= 0 ? ' · ' : c.indexOf(', ') >= 0 && !/[()]/.test(c) ? ', ' : null;

    + '.ncr .nt{font-size:12.5px;color:var(--muted,#56607c);margin:0}.ncr .nt a{color:inherit}'
    + '.ncr .bt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}'
    + '.ncr button{font:600 14.5px var(--body,inherit);border-radius:10px;padding:8px 16px;min-height:40px;cursor:pointer;border:1px solid var(--line,#d5d9e4);background:var(--panel,#fff);color:inherit}'
    + '.ncr button.go{background:var(--ember,#c4561a);border-color:var(--ember,#c4561a);color:#fff}.ncr button:disabled{opacity:.6;cursor:wait}'
    + '.ncr .msg{font-size:14px;margin:0;min-height:1em}.ncr .msg.bad{color:var(--bad,#c0392b)}.ncr .msg.ok{color:var(--good,#2e7d4f)}';
  var dlg = null;
  function build() {
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    dlg = document.createElement('dialog'); dlg.className = 'ncr'; dlg.setAttribute('aria-labelledby', 'ncrH');
    dlg.innerHTML = '<form novalidate><p class="hd" id="ncrH">' + X(T('แจ้งข้อมูลผิด', 'Report a mistake')) + '</p><div class="pg" id="ncrP"></div>'
      + '<label>' + X(T('อะไรผิด', 'What is wrong')) + '<textarea id="ncrW" maxlength="1000" rows="3" required placeholder="' + X(T('เช่น HP ของมอนตัวนี้ที่ Lv 50 ไม่ตรงกับในเกม', 'e.g. this monster\'s HP at Lv 50 does not match the game')) + '"></textarea></label>'
      + '<label><div>' + X(T('ในเกมเป็นแบบไหน', 'What the game shows')) + ' <span>' + X(T('(ไม่ใส่ก็ได้)', '(optional)')) + '</span></div><textarea id="ncrC" maxlength="1000" rows="2"></textarea></label>'
      + '<div class="hp" aria-hidden="true"><label>Website<input id="ncrHp" tabindex="-1" autocomplete="off"></label></div>'
      + '<p class="nt">' + X(T('ไม่ต้องใส่ชื่อหรือช่องทางติดต่อ เราไม่เก็บข้อมูลส่วนตัว แนบรูปที่นี่ไม่ได้ ถ้าอยากแนบรูป ', 'No name or contact needed, nothing personal is kept. Pictures cannot be attached here; to send one, ')) + '<a id="ncrG" target="_blank" rel="noopener">' + X(T('แจ้งผ่าน GitHub', 'use GitHub')) + '</a></p>'
      + '<p class="msg" id="ncrM" role="status" aria-live="polite"></p>'
      + '<div class="bt"><button type="button" id="ncrX">' + X(T('ปิด', 'Close')) + '</button><button type="submit" class="go" id="ncrS">' + X(T('ส่ง', 'Send')) + '</button></div></form>';
    document.body.appendChild(dlg);
    var $ = function (id) { return dlg.querySelector('#' + id); };
    $('ncrX').onclick = function () { dlg.close(); };
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });   // a tap outside the box
    dlg.querySelector('form').onsubmit = function (e) {
      e.preventDefault();
      var m = $('ncrM'), w = $('ncrW').value.trim(), c = $('ncrC').value.trim(), p = where(), s = $('ncrS');
      var say = function (t, cls) { m.textContent = t; m.className = 'msg ' + (cls || ''); };
      if (w.length < 3) { say(T('เขียนว่าอะไรผิดสักหน่อยก่อนส่ง', 'Write what is wrong first'), 'bad'); $('ncrW').focus(); return; }
      if ($('ncrHp').value) { done(); return; }   // (a bot filled the hidden box: look sent, send nothing)
      s.disabled = true; say(T('กำลังส่ง…', 'Sending…'));
      fetch(SB + '/rest/v1/rpc/submit_report', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_url: p.url, p_title: p.title, p_wrong: w, p_correct: c, p_lang: en ? 'en' : 'th' }) })
        .then(function (r) { if (r.ok) return null; return r.json().catch(function () { return {}; }).then(function (j) { throw new Error(j && j.message || 'http ' + r.status); }); })
        .then(done)
        .catch(function (err) {
          var t = String(err && err.message || '');
          say(/already sent/.test(t) ? T('เรื่องนี้ส่งไปแล้ว ขอบคุณครับ', 'Already sent, thank you')
            : /too many/.test(t) ? T('ตอนนี้มีคนแจ้งเยอะ ลองใหม่ในอีกสักครู่ หรือแจ้งผ่าน GitHub', 'Too many reports right now, try again in a minute or use GitHub')
            : T('ส่งไม่สำเร็จ ลองใหม่อีกครั้ง หรือแจ้งผ่าน GitHub', 'Could not send, try again or use GitHub'), 'bad');
          s.disabled = false;
        });
      function done() { $('ncrW').value = ''; $('ncrC').value = ''; s.disabled = false; say(T('ได้รับแล้ว ขอบคุณที่ช่วยแจ้งครับ', 'Got it, thank you for the report'), 'ok'); }
    };
  }
  window.NC_OPEN_REPORT = function () {
    var p = where();
    if (typeof HTMLDialogElement === 'undefined') { window.open(ghUrl(p), '_blank', 'noopener'); return; }   // (very old browsers: the GitHub form)
    if (!dlg) build();
    dlg.querySelector('#ncrP').textContent = T('หน้า: ', 'Page: ') + p.title;
    dlg.querySelector('#ncrG').href = ghUrl(p);
    dlg.querySelector('#ncrM').textContent = '';
    dlg.showModal(); dlg.querySelector('#ncrW').focus();
  };
  window.NC_REPORT_GH = function () { return ghUrl(where()); };
})();

(function () {
  // a mistake on this page: the form on the page (report_dialog.js); the link itself is the GitHub form, for no script
  var a = document.getElementById('ncrep'); if (!a) return;
  a.addEventListener('click', function (e) { e.preventDefault(); window.NC_OPEN_REPORT(); });
})();</script>
<script>// Words players trip over, explained where they appear: a table header, a label or a tag whose whole text is one of these

(function () {

  const G = {

    MATK: ['พลังเวท มาจาก INT · สกิลเวทแรงเป็น % ของค่านี้', 'Magic attack, from INT · spells hit for a % of it'],

    SP: ['พลังที่ใช้ร่ายสกิล ฟื้นด้วยยาฟ้าหรือรอเวลา', 'What skills cost; restored by blue potions or over time'],
    HP: ['พลังชีวิต หมดแล้วตาย', 'Health; at zero you fall'],
    EXP: ['ค่าประสบการณ์ เต็มแล้วเลเวลขึ้น', 'Experience; fill it to level up'],
    Job: ['Job EXP ค่าประสบการณ์อาชีพ ใช้ขึ้น Job Lv ได้แต้มสกิล', 'Job EXP: raises Job Lv, which gives skill points'],
    'Job Lv': ['เลเวลอาชีพ ขึ้นแล้วได้แต้มสกิล 1 แต้ม', 'Job level: each one gives a skill point'],

    ตีเร็ว: ['ความเร็วตีปกติ มาจาก AGI และ DEX เล็กน้อย', 'Basic attack speed, from AGI (and a little DEX)'],
    คูลดาวน์: ['เวลารอก่อนใช้สกิลเดิมซ้ำได้', 'Wait before the same skill can be used again'],
    ดีเลย์: ['เวลาหยุดหลังกดสกิล ก่อนกดสกิลถัดไปได้', 'The pause after a skill before the next one'],
    เกรด: ['ระดับของไอเทม 1–4 (ตามเลเวลไอเทม) ใช้คิดราคาและโอกาสตีบวก', 'Item grade 1–4 (by item level); sets refine prices and odds'],
    'เลเวลฉัน': ['เลเวลตัวละครของคุณ ใช้คิดช่องว่างเลเวลกับมอน: ห่างไม่เกิน 3 ได้ EXP และของเต็ม', 'Your level, for the level gap: within 3 levels of a monster you get full EXP and drops'],
    'ช่องว่างเลเวล': ['ต่างจากมอน ≤3 เลเวล = 100% · 4–8 = 70% · 9–14 = 40% · 15–20 = 20% · มากกว่า = 5% (ทั้ง EXP และดรอป)', 'Level gap to a monster: ≤3 = 100% · 4–8 = 70% · 9–14 = 40% · 15–20 = 20% · more = 5% (EXP and drops)'],
    'ร่างพิเศษ': ['มอนร่างสีพิเศษ เกิดน้อยกว่า แข็งกว่า และดรอปดีกว่าร่างปกติ', 'A rare colour form: tougher, with better drops'],
    ธาตุ: ['ธาตุที่ตีใส่ธาตุของมอน แรงขึ้นหรือเบาลงตามตารางธาตุ (เช่น ไฟตีดิน ×1.5)', 'Your element against the monster\'s: stronger or weaker by the element table (e.g. fire on earth ×1.5)'],
  };
  const KEY = {}; for (const k of Object.keys(G)) KEY[k.toLowerCase()] = k;
  // the English pages show English words for some Thai keys
  const ALIAS = { crit: 'คริ', 'attack speed': 'ตีเร็ว', cooldown: 'คูลดาวน์', delay: 'ดีเลย์', grade: 'เกรด', 'my level': 'เลเวลฉัน', 'special form': 'ร่างพิเศษ', element: 'ธาตุ', 'level gap': 'ช่องว่างเลเวล' };
  const one = (s) => KEY[s.toLowerCase()] || ALIAS[s.toLowerCase()] || null;
  // the whole text, or a short label that starts with a term ("ATK สเตตัส", "HIT / FLEE")
  const find = (t) => { const s = t.trim().replace(/[:：]$/, '').trim(); return one(s) || (s.length <= 16 ? one(s.split(/[\s/]+/)[0]) : null); };

  });
