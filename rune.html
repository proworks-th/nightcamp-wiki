<title>NightCamp รูนจารึกสกิล</title>

<style>
/* รูนจารึกสกิล: every rune as a card (filter by the kind of skill it fits, tier I-III), and the runes for my job */
:root{
  --bg:#eef0f6; --panel:#ffffff; --panel2:#e3e7f1; --line:#c9cfdf; --fg:#18203a; --muted:#56607c;
  --ember:#c4561a; --moon:#3c4fa8; --rune:#6a4fc8; --rune-soft:#ece6ff;
  --display:'Mitr','Noto Sans Thai',system-ui,sans-serif; --body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --k-proj:#2f7fc4; --k-area:#2f9e6c; --k-melee:#c4561a; --k-attack:#b33a3a; --k-buff:#c79a17; --k-pet:#8a4fd0; --k-any:#6b7390;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10132a; --panel:#181c38; --panel2:#20254a; --line:#2f3563; --fg:#e9ebf7; --muted:#a3a9cc;
  --ember:#f59a4c; --moon:#aab8ff; --rune:#b49cff; --rune-soft:#2a2550;
  --k-proj:#7fc0ff; --k-area:#5ad19a; --k-melee:#f59a4c; --k-attack:#ff8a8a; --k-buff:#f2cc4d; --k-pet:#c9a2ff; --k-any:#a3a9cc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10132a; --panel:#181c38; --panel2:#20254a; --line:#2f3563; --fg:#e9ebf7; --muted:#a3a9cc;
  --ember:#f59a4c; --moon:#aab8ff; --rune:#b49cff; --rune-soft:#2a2550;
  --k-proj:#7fc0ff; --k-area:#5ad19a; --k-melee:#f59a4c; --k-attack:#ff8a8a; --k-buff:#f2cc4d; --k-pet:#c9a2ff; --k-any:#a3a9cc; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 40px}
header.top{padding-block:18px 6px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0}
h1 span{color:var(--rune)}
h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0 0 8px}
.lead{margin:6px 0 0;max-width:820px}
.muted{color:var(--muted)}
a{color:var(--moon)}
.how{margin:12px 0 14px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:14px}
.how b{font-family:var(--display);font-weight:500}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:4px 0 12px}
.seg button{font:500 15px var(--display);border:0;background:none;color:var(--muted);padding:8px 14px;border-radius:9px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--rune);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 14px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{border-color:var(--rune);background:var(--rune-soft);color:var(--rune);font-weight:600}
input[type=search],select{font:15px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-height:40px}
input[type=search]{min-width:0;width:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card h3{font:500 17px var(--display);margin:0;display:flex;align-items:center;gap:8px}
.k{display:inline-block;font:500 12px var(--body);padding:1px 9px;border-radius:999px;color:var(--kc);border:1px solid color-mix(in srgb,var(--kc) 50%,transparent);background:color-mix(in srgb,var(--kc) 12%,transparent);white-space:nowrap}
.fx{font-size:15px;margin:0}
.tiers{margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.tiers li b{font-family:var(--mono);font-weight:500;color:var(--fg);margin-right:4px}
.tiers li.on{color:var(--fg)}
.foot{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin-top:auto;padding-top:4px;border-top:1px dashed var(--line)}
.rsrc{font-size:12.5px;color:var(--muted);flex:1 1 14em;min-width:0;overflow-wrap:anywhere;white-space:normal}
.empty{padding:24px;text-align:center;color:var(--muted)}
/* my job */
.legend{display:grid;gap:6px;margin-bottom:12px}
.legend div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.rl a{white-space:nowrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
thead th{font:600 12px var(--mono);color:var(--muted);background:var(--panel2);white-space:nowrap}
td.sl{font-family:var(--mono);white-space:nowrap}
td.nm{white-space:nowrap}
.jh{font:500 15px var(--display);background:var(--panel2)}
@media (max-width:640px){input[type=search]{width:100%}.bar label{width:100%}th,td{padding:7px 8px}td.nm{white-space:normal}}
</style>
<style>/* shared by every page (site.py puts it in each head): where a number comes from, and "how to read this" */
.src{display:inline-block;font:600 11px/1.6 var(--body,system-ui);padding:0 7px;border-radius:999px;vertical-align:middle;white-space:nowrap;letter-spacing:.2px}
.src.game{background:color-mix(in srgb,var(--moon,#3c4fa8) 14%,transparent);color:var(--moon,#3c4fa8)}
.src.est{background:color-mix(in srgb,var(--ember,#c4561a) 16%,transparent);color:var(--ember,#c4561a)}
details.howto{margin:10px 0;border:1px solid var(--line,#c9cfdf);border-radius:12px;background:var(--panel,#fff);font-size:14px}
details.howto>summary{cursor:pointer;padding:8px 12px;font-weight:600;list-style:none}
details.howto>summary::-webkit-details-marker{display:none}
details.howto>summary::before{content:"ⓘ ";color:var(--moon,#3c4fa8)}
details.howto>ul{margin:0;padding:0 14px 6px 30px}
details.howto li{margin:4px 0}
details.howto>p{margin:0;padding:4px 12px 10px;color:var(--muted,#56607c);font-size:13px}
.wk{white-space:nowrap}
</style><style>/* touch screens: every control at least 44 x 44 CSS px (Apple / Android guidance), links in lists and tables at least
   24 px tall (WCAG 2.2 target size). Only on touch (pointer: coarse); the desktop look is unchanged. Loaded after each
   page's own style, so it wins; !important only on the sizes, because some widgets add their style later. */
@media (pointer: coarse) {
  button, select, summary, [role=button], .btn, .chip, a.btn,
  input:not([type=checkbox]):not([type=radio]):not([type=hidden]):not([type=range]) { min-height: 44px !important; }
  button, [role=button], .btn, .chip, a.btn, select { min-width: 44px !important; }
  summary { display: list-item; padding-block: 10px; box-sizing: border-box; }
  label:has(> input[type=checkbox]), label:has(> input[type=radio]) { display: inline-flex; align-items: center; gap: 8px; min-height: 44px !important; }
  a.brand, #brand, .ddm a, [role=menuitem] { display: inline-flex; align-items: center; min-height: 44px !important; }
  .ddm a, [role=menuitem] { display: flex; }
  /* plain links: 4 px above and below (an inline link's padding grows its tap area without moving the text); :where()
     keeps this weaker than any padding a page sets itself */
  :where(a[href]:not(.btn):not(.chip)) { padding-block: 4px; }
  a.kt { padding-block: 4px; }   /* the skill-kind tags on the wiki (links drawn as small tags) */
}
</style></head>

    var sep = c.indexOf(' · ') >= 0 ? ' · ' : c.indexOf(', ') >= 0 && !/[()]/.test(c) ? ', ' : null;
    if (sep) {

    DEF: ['ป้องกันกายภาพ ลดดาเมจที่รับจากการตีธรรมดาและสกิลกายภาพ', 'Physical defence: lowers physical damage taken'],
    MDEF: ['ป้องกันเวท ลดดาเมจเวทที่รับ', 'Magic defence: lowers magic damage taken'],
    HIT: ['ความแม่น = เลเวล + DEX (+ อุปกรณ์) ยิ่งสูงยิ่งตีโดน', 'Accuracy = level + DEX (+ gear): higher hits more often'],
    FLEE: ['การหลบ = เลเวล + AGI (+ อุปกรณ์) ยิ่งสูงมอนยิ่งตีพลาด', 'Evasion = level + AGI (+ gear): monsters miss more'],
    SP: ['พลังที่ใช้ร่ายสกิล ฟื้นด้วยยาฟ้าหรือรอเวลา', 'What skills cost; restored by blue potions or over time'],
    HP: ['พลังชีวิต หมดแล้วตาย', 'Health; at zero you fall'],
    EXP: ['ค่าประสบการณ์ เต็มแล้วเลเวลขึ้น', 'Experience; fill it to level up'],
    Job: ['Job EXP ค่าประสบการณ์อาชีพ ใช้ขึ้น Job Lv ได้แต้มสกิล', 'Job EXP: raises Job Lv, which gives skill points'],
    'Job Lv': ['เลเวลอาชีพ ขึ้นแล้วได้แต้มสกิล 1 แต้ม', 'Job level: each one gives a skill point'],
    คริ: ['โอกาสคริติคอล (ตีแรงพิเศษ) มาจาก LUK และอุปกรณ์', 'Critical chance (an extra-hard hit), from LUK and gear'],
    คริติคอล: ['โอกาสตีแรงพิเศษ มาจาก LUK และอุปกรณ์', 'Chance of an extra-hard hit, from LUK and gear'],
    ตีเร็ว: ['ความเร็วตีปกติ มาจาก AGI และ DEX เล็กน้อย', 'Basic attack speed, from AGI (and a little DEX)'],
    คูลดาวน์: ['เวลารอก่อนใช้สกิลเดิมซ้ำได้', 'Wait before the same skill can be used again'],
    ดีเลย์: ['เวลาหยุดหลังกดสกิล ก่อนกดสกิลถัดไปได้', 'The pause after a skill before the next one'],
    เกรด: ['ระดับของไอเทม 1–4 (ตามเลเวลไอเทม) ใช้คิดราคาและโอกาสตีบวก', 'Item grade 1–4 (by item level); sets refine prices and odds'],
    'เลเวลฉัน': ['เลเวลตัวละครของคุณ ใช้คิดช่องว่างเลเวลกับมอน: ห่างไม่เกิน 3 ได้ EXP และของเต็ม', 'Your level, for the level gap: within 3 levels of a monster you get full EXP and drops'],
    'ช่องว่างเลเวล': ['ต่างจากมอน ≤3 เลเวล = 100% · 4–8 = 70% · 9–14 = 40% · 15–20 = 20% · มากกว่า = 5% (ทั้ง EXP และดรอป)', 'Level gap to a monster: ≤3 = 100% · 4–8 = 70% · 9–14 = 40% · 15–20 = 20% · more = 5% (EXP and drops)'],
    'ร่างพิเศษ': ['มอนร่างสีพิเศษ เกิดน้อยกว่า แข็งกว่า และดรอปดีกว่าร่างปกติ', 'A rare colour form: tougher, with better drops'],
    ธาตุ: ['ธาตุที่ตีใส่ธาตุของมอน แรงขึ้นหรือเบาลงตามตารางธาตุ (เช่น ไฟตีดิน ×1.5)', 'Your element against the monster\'s: stronger or weaker by the element table (e.g. fire on earth ×1.5)'],
  };
  const KEY = {}; for (const k of Object.keys(G)) KEY[k.toLowerCase()] = k;
  // the English pages show English words for some Thai keys
  const ALIAS = { crit: 'คริ', 'attack speed': 'ตีเร็ว', cooldown: 'คูลดาวน์', delay: 'ดีเลย์', grade: 'เกรด', 'my level': 'เลเวลฉัน', 'special form': 'ร่างพิเศษ', element: 'ธาตุ', 'level gap': 'ช่องว่างเลเวล' };
  const one = (s) => KEY[s.toLowerCase()] || ALIAS[s.toLowerCase()] || null;
  // the whole text, or a short label that starts with a term ("ATK สเตตัส", "HIT / FLEE")
  const find = (t) => { const s = t.trim().replace(/[:：]$/, '').trim(); return one(s) || (s.length <= 16 ? one(s.split(/[\s/]+/)[0]) : null); };
  const st = document.createElement('style');
  st.textContent = '.gl{text-decoration:underline dotted;text-underline-offset:3px;cursor:help}.glpop{position:fixed;z-index:99;max-width:min(320px,90vw);background:var(--fg,#18203a);color:var(--bg,#fff);font:13px/1.45 var(--body,system-ui);padding:8px 10px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}';
  document.head.appendChild(st);
  function mark(root) {
    for (const el of (root || document).querySelectorAll('th, label, .lab, .tag, .chip, .sxc, small, .muted, h3, span')) {
      if (el.dataset.gl || el.children.length > 1) continue;
      const k = find(el.textContent || ''); if (!k) continue;
      el.dataset.gl = k; el.classList.add('gl'); el.title = G[k][EN ? 1 : 0];
    }
  }
  let pop = null;
  document.addEventListener('click', (e) => {
    const g = e.target.closest && e.target.closest('[data-gl]');
    if (pop) { pop.remove(); pop = null; }
    if (!g || g.closest('button, a, select')) return;
    pop = document.createElement('div'); pop.className = 'glpop'; pop.textContent = G[g.dataset.gl][EN ? 1 : 0]; document.body.appendChild(pop);
    const r = g.getBoundingClientRect(); pop.style.left = Math.max(8, Math.min(innerWidth - pop.offsetWidth - 8, r.left)) + 'px'; pop.style.top = (r.bottom + 6 + pop.offsetHeight > innerHeight ? r.top - pop.offsetHeight - 6 : r.bottom + 6) + 'px';
  });
  let t = 0; new MutationObserver(() => { clearTimeout(t); t = setTimeout(() => mark(), 120); }).observe(document.body, { childList: true, subtree: true });
  mark();
  window.NC_GLOSS = G;
  // the guide's word list (game systems)
  const L = document.getElementById('glossList');
  if (L) L.innerHTML = '<dl style="margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:14px">' + Object.entries(G).map(([k, v]) => `<dt style="font-weight:600">${k}</dt><dd style="margin:0">${v[EN ? 1 : 0].replace(/[<>&]/g, '')}</dd>`).join('') + '</dl>';
})();
</script></body>
</html>
